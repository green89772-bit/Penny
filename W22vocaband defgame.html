<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Fishing Game</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            background-color: #0f172a; /* slate-900 */
        }
        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons (SVG Components) ---
        const IconBase = ({ children, className, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3" /></IconBase>;
        const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12" /><path d="M3 3v9h9" /></IconBase>;
        const Trophy = (props) => <IconBase {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M12 15a7 7 0 0 0 7-7c0-2-1-3-2-3H7c-1 0-2 1-2 3a7 7 0 0 0 7 7Z" /><path d="M12 15v7" /></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></IconBase>;
        const FishIcon = (props) => <IconBase {...props}><path d="M6.5 12c.94-2.08 2.3-4 4.14-5.66A9.5 9.5 0 0 1 19.5 3a1.7 1.7 0 0 1 2.36 2.07l-.97 3.92c-.3.96.14 2 1 2.4l3.11 1.43a2 2 0 0 1 .4 3.72l-3.3 1.65a2 2 0 0 0-1 2.03l.97 3.52a1.7 1.7 0 0 1-2.3 2.1 19.12 19.12 0 0 1-9.1-8.8" /><path d="M12 12h.01" /></IconBase>;
        const Volume2 = (props) => <IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></IconBase>;
        const VolumeX = (props) => <IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></IconBase>;

        // --- Vocabulary Data ---
        const VOCAB_LIST = [
            { word: "wise", def: "to be smart and use knowledge well" },
            { word: "helpful", def: "willing to help, or useful" },
            { word: "celebration", def: "a special social event, such as a party, when you celebrate something" },
            { word: "culture", def: "the way of life of groups of people, including their customs, beliefs, art, food, clothing, languages" },
            { word: "routine", def: "a usual way of doing things" },
            { word: "forwards", def: "towards the direction that is in front of you" },
            { word: "backwards", def: "opposite to the one in which you are facing" },
            { word: "burn", def: "to be hurt, damaged, or destroyed by fire or extreme heat, or to cause this to happen" },
            { word: "village", def: "a very small town located in a country area" },
            { word: "scream", def: "to give a loud, high shout, because you are hurt, frightened, excited, etc." },
            { word: "dragon", def: "a large creature that looks like a giant lizard or snake, often with wings and the ability to breathe fire" },
            { word: "remember", def: "to be able to bring back a piece of information into your mind" },
            { word: "technology", def: "scientific knowledge used in practical ways in industry" },
            { word: "magical", def: "produced by or using magic" },
            { word: "noise", def: "a sound or sounds, especially when it is unwanted, unpleasant, or loud" }
        ];

        // --- Game Constants ---
        const GAME_DURATION = 90; // seconds
        const FISH_SPAWN_RATE = 100; // frames
        const HOOK_SPEED = 6;
        const COLORS = ['#FF4757', '#2ED573', '#FFA502', '#3742FA', '#e056fd', '#f0932b'];

        // --- Components ---
        const Button = ({ onClick, children, className = "", disabled = false, color = "blue" }) => {
            const colorClasses = {
                blue: "bg-blue-500 hover:bg-blue-400 border-b-4 border-blue-700 active:border-b-0 active:translate-y-1",
                green: "bg-green-500 hover:bg-green-400 border-b-4 border-green-700 active:border-b-0 active:translate-y-1",
                orange: "bg-orange-500 hover:bg-orange-400 border-b-4 border-orange-700 active:border-b-0 active:translate-y-1",
            };
            return (
                <button 
                onClick={onClick}
                disabled={disabled}
                className={`px-8 py-4 rounded-2xl font-black text-white shadow-xl transition-all ${colorClasses[color] || colorClasses.blue} ${className}`}
                >
                {children}
                </button>
            );
        };

        const Modal = ({ children }) => (
            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fadeIn">
                <div className="bg-white rounded-3xl p-8 max-w-lg w-full shadow-[0_20px_50px_rgba(0,0,0,0.5)] border-4 border-slate-900 animate-slideUp relative overflow-hidden">
                    <div className="absolute -top-20 -right-20 w-60 h-60 bg-yellow-300 rounded-full opacity-20 pointer-events-none" />
                    <div className="absolute -bottom-20 -left-20 w-40 h-40 bg-blue-300 rounded-full opacity-20 pointer-events-none" />
                    <div className="relative z-10">{children}</div>
                </div>
            </div>
        );

        function App() {
            const [gameState, setGameState] = useState('menu'); 
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
            const [caughtFish, setCaughtFish] = useState(null);
            const [options, setOptions] = useState([]); 
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [combo, setCombo] = useState(0);
            
            const canvasRef = useRef(null);
            const requestRef = useRef(null);
            const frameCountRef = useRef(0);
            const audioCtxRef = useRef(null);
            
            const gameObjects = useRef({
                fish: [],
                particles: [],
                clouds: [],
                hook: { x: 0, y: 100, length: 0, state: 'idle', targetY: 0 },
                boat: { x: 0, y: 40, width: 140, height: 60, angle: 0 },
                waveOffset: 0
            });

            // --- Audio System ---
            const initAudio = () => {
                if (!audioCtxRef.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtxRef.current = new AudioContext();
                }
                if (audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
            };

            const playSound = (type) => {
                if (!soundEnabled || !audioCtxRef.current) return;
                
                const ctx = audioCtxRef.current;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                if (type === 'cast') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'splash') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'correct') {
                    const t = now;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, t);
                    osc.frequency.setValueAtTime(1760, t + 0.1);
                    gainNode.gain.setValueAtTime(0.1, t);
                    gainNode.gain.linearRampToValueAtTime(0.1, t + 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                    osc.start(t);
                    osc.stop(t + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            };

            // --- Helpers ---
            const getRandomOptions = (correctWord) => {
                const wrongOptions = VOCAB_LIST
                    .filter(item => item.word !== correctWord)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(item => item.word);
                return [correctWord, ...wrongOptions].sort(() => 0.5 - Math.random());
            };

            const spawnFish = (canvasWidth, canvasHeight) => {
                const wordObj = VOCAB_LIST[Math.floor(Math.random() * VOCAB_LIST.length)];
                const isRight = Math.random() > 0.5;
                const y = 200 + Math.random() * (canvasHeight - 250);
                const size = 35 + Math.random() * 25;
                
                gameObjects.current.fish.push({
                    x: isRight ? -100 : canvasWidth + 100,
                    y: y,
                    width: size * 1.5,
                    height: size,
                    speed: (1.5 + Math.random() * 2.5) * (isRight ? 1 : -1),
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    word: wordObj.word,
                    def: wordObj.def,
                    direction: isRight ? 1 : -1,
                    type: 'fish',
                    wobbleOffset: Math.random() * Math.PI * 2
                });
            };

            const spawnClouds = (canvasWidth) => {
                if (gameObjects.current.clouds.length < 5) {
                    gameObjects.current.clouds.push({
                        x: -200,
                        y: 20 + Math.random() * 80,
                        scale: 0.5 + Math.random() * 0.8,
                        speed: 0.2 + Math.random() * 0.3
                    });
                }
            };

            const createParticles = (x, y, color, count = 15, type = 'circle') => {
                for (let i = 0; i < count; i++) {
                    gameObjects.current.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        life: 1.0,
                        color,
                        type,
                        size: Math.random() * 6 + 2,
                        gravity: 0.1
                    });
                }
            };

            // --- Game Loop ---
            const update = (canvas) => {
                const width = canvas.width;
                const height = canvas.height;
                const { fish, hook, boat, particles, clouds } = gameObjects.current;

                const time = frameCountRef.current * 0.05;
                gameObjects.current.waveOffset += 0.05;

                // Boat Bobbing
                boat.y = 135 + Math.sin(time) * 5;
                boat.angle = Math.sin(time * 0.5) * 0.05;
                boat.x = width / 2 - boat.width / 2;
                if (hook.state === 'idle' || hook.state === 'casting') {
                    hook.x = width / 2;
                    hook.startY = boat.y + 40; 
                }

                frameCountRef.current++;
                if (frameCountRef.current % FISH_SPAWN_RATE === 0) spawnFish(width, height);
                if (Math.random() < 0.01) spawnClouds(width);

                for (let i = clouds.length - 1; i >= 0; i--) {
                    let c = clouds[i];
                    c.x += c.speed;
                    if (c.x > width + 200) clouds.splice(i, 1);
                }

                for (let i = fish.length - 1; i >= 0; i--) {
                    const f = fish[i];
                    f.x += f.speed;
                    f.y += Math.sin(time + f.wobbleOffset) * 0.5;
                    
                    if ((f.speed > 0 && f.x > width + 150) || (f.speed < 0 && f.x < -150)) {
                        fish.splice(i, 1);
                        continue;
                    }

                    if (hook.state === 'casting') {
                        const hookTipX = hook.x;
                        const hookTipY = hook.y + hook.length;
                        if (hookTipX > f.x && hookTipX < f.x + f.width && hookTipY > f.y && hookTipY < f.y + f.height) {
                            hook.state = 'caught';
                            setCaughtFish(f);
                            setGameState('quiz');
                            setOptions(getRandomOptions(f.word));
                            createParticles(f.x + f.width/2, f.y + f.height/2, '#FFF', 20, 'star');
                            playSound('splash');
                            fish.splice(i, 1);
                        }
                    }
                }

                const maxDepth = height - 50;
                if (hook.state === 'casting') {
                    hook.length += HOOK_SPEED;
                    if (hook.y + hook.length >= maxDepth) hook.state = 'retracting';
                } else if (hook.state === 'retracting') {
                    hook.length -= HOOK_SPEED * 1.5;
                    if (hook.length <= 0) {
                        hook.length = 0;
                        hook.state = 'idle';
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.life -= 0.02;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            };

            const draw = (canvas) => {
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                const { fish, hook, boat, particles, clouds, waveOffset } = gameObjects.current;

                ctx.clearRect(0, 0, width, height);

                // Sky
                const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
                skyGrad.addColorStop(0, '#38b6ff'); 
                skyGrad.addColorStop(0.4, '#a2d9ff');
                skyGrad.addColorStop(0.4, '#005f87');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, width, height);

                // Sun
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#FDB813';
                ctx.fillStyle = '#FDB813';
                ctx.beginPath();
                ctx.arc(100, 80, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                clouds.forEach(c => {
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.scale(c.scale, c.scale);
                    ctx.beginPath();
                    ctx.arc(0, 0, 30, 0, Math.PI * 2);
                    ctx.arc(40, -10, 40, 0, Math.PI * 2);
                    ctx.arc(80, 0, 30, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Water
                const waveY = 160;
                ctx.fillStyle = '#005f87';
                ctx.beginPath();
                ctx.moveTo(0, height);
                ctx.lineTo(0, waveY);
                for (let x = 0; x <= width; x += 20) {
                    ctx.lineTo(x, waveY + Math.sin(x * 0.01 + waveOffset * 0.5) * 15);
                }
                ctx.lineTo(width, height);
                ctx.fill();

                ctx.fillStyle = 'rgba(0, 168, 255, 0.6)';
                ctx.beginPath();
                ctx.moveTo(0, height);
                ctx.lineTo(0, waveY + 10);
                for (let x = 0; x <= width; x += 20) {
                    ctx.lineTo(x, waveY + 10 + Math.sin(x * 0.015 + waveOffset) * 20);
                }
                ctx.lineTo(width, height);
                ctx.fill();

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(0, waveY);
                ctx.lineTo(width, waveY);
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.clip();
                const rayGrad = ctx.createLinearGradient(width/2, 0, width/2, height);
                rayGrad.addColorStop(0, 'rgba(255,255,255,0.1)');
                rayGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
                ctx.fillStyle = rayGrad;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();

                // Boat
                ctx.save();
                ctx.translate(boat.x + boat.width/2, boat.y + boat.height/2);
                ctx.rotate(boat.angle);
                ctx.translate(-(boat.x + boat.width/2), -(boat.y + boat.height/2));
                
                ctx.fillStyle = '#FF5252'; 
                ctx.beginPath();
                ctx.moveTo(boat.x, boat.y);
                ctx.lineTo(boat.x + boat.width, boat.y);
                ctx.quadraticCurveTo(boat.x + boat.width - 10, boat.y + boat.height, boat.x + boat.width/2, boat.y + boat.height);
                ctx.quadraticCurveTo(boat.x + 10, boat.y + boat.height, boat.x, boat.y);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.fillRect(boat.x + 10, boat.y + 10, boat.width - 20, 10);
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(boat.x + boat.width/2 - 3, boat.y - 60, 6, 60);
                ctx.fillStyle = '#FFD700'; 
                ctx.beginPath();
                ctx.moveTo(boat.x + boat.width/2, boat.y - 55);
                ctx.lineTo(boat.x + boat.width/2 + 50, boat.y - 25);
                ctx.lineTo(boat.x + boat.width/2, boat.y - 5);
                ctx.fill();
                ctx.restore();

                // Hook
                const startY = boat.y + 10;
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(hook.x, startY);
                ctx.lineTo(hook.x, hook.y + hook.length);
                ctx.stroke();

                const hookY = hook.y + hook.length;
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(hook.x - 6, hookY, 6, 0, Math.PI, false);
                ctx.stroke();

                // Fish
                fish.forEach(f => {
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = f.color;
                    ctx.fillStyle = f.color;
                    
                    ctx.translate(f.x + f.width/2, f.y + f.height/2);
                    ctx.scale(f.direction, 1);
                    ctx.translate(-(f.x + f.width/2), -(f.y + f.height/2));

                    ctx.beginPath();
                    ctx.ellipse(f.x + f.width/2, f.y + f.height/2, f.width/2, f.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(f.x, f.y + f.height/2);
                    ctx.lineTo(f.x - 15, f.y);
                    ctx.lineTo(f.x - 15, f.y + f.height);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(f.x + f.width - 15, f.y + 12, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(f.x + f.width - 13, f.y + 12, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(f.x + f.width/2, f.y + f.height/2 + 5, f.width/4, f.height/4, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.restore(); 

                    ctx.fillStyle = 'white';
                    ctx.font = '900 20px "Fredoka One", sans-serif'; 
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 4;
                    ctx.textAlign = 'center';
                    ctx.fillText("???", f.x + f.width/2, f.y);
                    ctx.shadowBlur = 0;
                });

                // Particles
                particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(frameCountRef.current * 0.2);
                    
                    if (p.type === 'star') {
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            ctx.lineTo(Math.cos((18 + i * 72) * 0.01745) * p.size, Math.sin((18 + i * 72) * 0.01745) * p.size);
                            ctx.lineTo(Math.cos((54 + i * 72) * 0.01745) * p.size * 0.5, Math.sin((54 + i * 72) * 0.01745) * p.size * 0.5);
                        }
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size, 0, Math.PI*2);
                        ctx.fill();
                    }
                    ctx.restore();
                    ctx.globalAlpha = 1.0;
                });
            };

            const gameLoop = useCallback(() => {
                if (gameState !== 'playing') return;

                const canvas = canvasRef.current;
                if (canvas) {
                    update(canvas);
                    draw(canvas);
                }
                requestRef.current = requestAnimationFrame(gameLoop);
            }, [gameState]);

            // --- Effects ---
            useEffect(() => {
                if (gameState === 'playing') {
                    requestRef.current = requestAnimationFrame(gameLoop);
                }
                return () => cancelAnimationFrame(requestRef.current);
            }, [gameState, gameLoop]);

            useEffect(() => {
                let timer;
                if (gameState === 'playing' && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                setGameState('results');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [gameState, timeLeft]);

            useEffect(() => {
                const handleResize = () => {
                    if (canvasRef.current) {
                        canvasRef.current.width = window.innerWidth;
                        canvasRef.current.height = window.innerHeight;
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // --- Handlers ---
            const handleCast = () => {
                if (gameState !== 'playing') return;
                if (gameObjects.current.hook.state === 'idle') {
                    gameObjects.current.hook.state = 'casting';
                    playSound('cast');
                }
            };

            const handleQuizAnswer = (selectedWord) => {
                const isCorrect = selectedWord === caughtFish.word;
                
                if (isCorrect) {
                    const comboMult = Math.min(combo + 1, 5);
                    const points = 100 * comboMult;
                    setScore(s => s + points);
                    setCombo(c => c + 1);
                    createParticles(canvasRef.current.width/2, 200, '#FFD700', 30, 'star'); 
                    createParticles(canvasRef.current.width/2, 200, '#FFF', 10, 'circle'); 
                    playSound('correct');
                } else {
                    setCombo(0);
                    playSound('wrong');
                }
                
                gameObjects.current.hook.state = 'retracting';
                setGameState('playing');
                setCaughtFish(null);
            };

            const startGame = () => {
                initAudio();
                setScore(0);
                setCombo(0);
                setTimeLeft(GAME_DURATION);
                setGameState('playing');
                gameObjects.current.fish = [];
                gameObjects.current.clouds = [];
                spawnClouds();
                gameObjects.current.hook.state = 'idle';
                gameObjects.current.hook.length = 0;
            };

            return (
                <div className="relative w-full h-screen overflow-hidden bg-slate-900 font-sans select-none text-slate-800">
                    
                    <button 
                        onClick={() => setSoundEnabled(!soundEnabled)}
                        className="absolute top-4 right-4 z-50 bg-white/20 hover:bg-white/40 p-3 rounded-full text-white backdrop-blur-sm transition-all active:scale-95 shadow-lg border-2 border-white/30"
                    >
                        {soundEnabled ? <Volume2 /> : <VolumeX />}
                    </button>

                    <canvas 
                        ref={canvasRef}
                        onClick={handleCast}
                        className="block w-full h-full cursor-pointer touch-none"
                    />

                    {gameState === 'playing' && (
                        <div className="absolute top-4 left-4 right-20 flex justify-between items-start pointer-events-none">
                            <div className="bg-white rounded-2xl p-2 pr-6 shadow-[0_8px_0_rgba(0,0,0,0.2)] border-4 border-slate-900 flex items-center gap-3 transform -rotate-1">
                                <div className="bg-yellow-400 p-3 rounded-xl border-2 border-slate-900">
                                    <Trophy className="text-white w-6 h-6" />
                                </div>
                                <div>
                                    <p className="text-xs text-slate-500 font-black uppercase tracking-wider">Score</p>
                                    <p className="text-3xl font-black text-slate-800">{score}</p>
                                </div>
                                {combo > 1 && (
                                    <div className="ml-2 animate-bounce">
                                        <span className="bg-orange-500 text-white text-xs font-black px-2 py-1 rounded-full border-2 border-white shadow-sm">
                                            {combo}x COMBO!
                                        </span>
                                    </div>
                                )}
                            </div>
                            
                            <div className="bg-white rounded-2xl p-2 pr-6 shadow-[0_8px_0_rgba(0,0,0,0.2)] border-4 border-slate-900 flex items-center gap-3 transform rotate-1">
                                <div className={`p-3 rounded-xl border-2 border-slate-900 ${timeLeft < 10 ? 'bg-red-500 animate-pulse' : 'bg-blue-400'}`}>
                                    <Clock className="text-white w-6 h-6" />
                                </div>
                                <div>
                                    <p className="text-xs text-slate-500 font-black uppercase tracking-wider">Time</p>
                                    <p className={`text-3xl font-black ${timeLeft < 10 ? 'text-red-500' : 'text-slate-800'}`}>
                                        {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState === 'playing' && gameObjects.current.hook.state === 'idle' && (
                        <div className="absolute bottom-12 left-1/2 -translate-x-1/2 pointer-events-none drop-shadow-lg animate-bounce">
                            <div className="bg-white/90 backdrop-blur px-6 py-2 rounded-full border-4 border-blue-500 text-blue-600 font-black text-xl uppercase tracking-widest shadow-xl">
                                點擊釣魚!
                            </div>
                        </div>
                    )}

                    {gameState === 'menu' && (
                        <div className="absolute inset-0 flex items-center justify-center bg-sky-900/60 backdrop-blur-md z-50">
                            <div className="bg-white p-10 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.5)] max-w-md w-full text-center border-4 border-slate-900 transform transition-all hover:scale-105 duration-300">
                                <div className="flex justify-center mb-8 relative">
                                    <div className="absolute inset-0 bg-blue-400 rounded-full blur-xl opacity-50 animate-pulse" />
                                    <div className="bg-gradient-to-tr from-blue-400 to-cyan-300 p-6 rounded-full border-4 border-slate-900 shadow-xl relative z-10 rotate-3 hover:rotate-6 transition-transform">
                                        <FishIcon className="w-20 h-20 text-white" />
                                    </div>
                                </div>
                                <h1 className="text-5xl font-black text-slate-800 mb-2 tracking-tight" style={{textShadow: "2px 2px 0px #cbd5e1"}}>
                                    Vocab<span className="text-blue-500">Fishing</span>
                                </h1>
                                <p className="text-slate-500 mb-8 font-bold text-lg">釣起單字魚，挑戰高分！</p>
                                
                                <div className="space-y-4">
                                    <Button onClick={startGame} className="w-full text-2xl flex items-center justify-center gap-3" color="green">
                                        <Play className="w-8 h-8 fill-current" /> 開始遊戲
                                    </Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState === 'quiz' && caughtFish && (
                        <Modal>
                            <div className="text-center">
                                <div className="inline-block bg-orange-100 text-orange-600 px-6 py-2 rounded-full text-sm font-black mb-6 uppercase tracking-wider border-2 border-orange-200 shadow-sm">
                                    <span className="mr-2">🎣</span> 你釣到魚了！
                                </div>
                                
                                <div className="mb-8 p-6 bg-slate-50 rounded-2xl border-2 border-slate-200 shadow-inner relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-2 h-full bg-blue-400" />
                                    <p className="text-slate-400 text-xs font-black uppercase mb-2 text-left pl-2">Definition</p>
                                    <h2 className="text-2xl font-bold text-slate-800 leading-normal text-left pl-2">
                                        "{caughtFish.def}"
                                    </h2>
                                </div>
                                
                                <p className="text-slate-500 mb-4 font-bold">這是哪個單字？</p>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    {options.map((option, idx) => (
                                        <button
                                        key={idx}
                                        onClick={() => handleQuizAnswer(option)}
                                        className="bg-white hover:bg-blue-50 border-b-4 border-slate-200 hover:border-blue-500 hover:text-blue-600 p-4 rounded-xl text-center text-slate-700 font-black text-lg transition-all active:border-b-0 active:translate-y-1 active:shadow-none shadow-sm"
                                        >
                                        {option}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </Modal>
                    )}

                    {gameState === 'results' && (
                        <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 backdrop-blur-md z-50 animate-fadeIn">
                            <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-sm w-full text-center border-4 border-slate-900 relative">
                                <div className="absolute -top-12 left-1/2 -translate-x-1/2 bg-yellow-400 p-4 rounded-full border-4 border-slate-900 shadow-lg">
                                    <Trophy className="w-12 h-12 text-white fill-white" strokeWidth={2} />
                                </div>
                                
                                <h2 className="text-4xl font-black text-slate-800 mb-2 mt-8">時間結束!</h2>
                                
                                <div className="bg-slate-100 rounded-2xl p-6 mb-8 border-2 border-slate-200 mt-6">
                                    <p className="text-sm text-slate-500 font-black uppercase tracking-widest">你的分數</p>
                                    <p className="text-6xl font-black text-blue-500 mt-2 filter drop-shadow-sm">{score}</p>
                                </div>
                                
                                <Button onClick={startGame} className="w-full flex items-center justify-center gap-2" color="blue">
                                    <RotateCcw className="w-6 h-6" /> 再玩一次
                                </Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
