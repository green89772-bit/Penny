<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seasons AI - 專業 AI 評分版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { background-color: #0f172a; font-family: 'Noto Sans TC', sans-serif; color: #f8fafc; overflow-x: hidden; touch-action: pan-y; }
        .font-game { font-family: 'Bungee', cursive; }
        .screen { display: none; min-height: 100vh; padding: 20px; flex-direction: column; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #energy-orb { transition: all 0.1s ease-out; background: radial-gradient(circle, #4ade80, #15803d); }
        #energy-orb.recording { background: radial-gradient(circle, #ef4444, #991b1b); box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .btn-locked { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

    <div class="max-w-md mx-auto relative min-h-screen pb-10">
        
        <div id="screen-login" class="screen active justify-center">
            <h1 class="text-5xl font-game text-green-400 mb-2 text-center">SEASONS AI</h1>
            <p class="text-slate-400 mb-10 uppercase text-sm text-center tracking-widest">Powered by Gemini</p>
            <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 w-full shadow-2xl">
                <label class="block text-sm font-bold text-slate-400 mb-2">SELECT YOUR NAME</label>
                <select id="heroSelect" class="w-full bg-slate-900 border-2 border-slate-600 rounded-xl p-4 text-white outline-none focus:border-green-500 mb-6 text-lg">
                    <option value="">-- Choose --</option>
                </select>
                <button onclick="app.login()" class="w-full bg-green-500 py-4 rounded-xl font-bold text-xl active:scale-95 transition-all">ENTER</button>
            </div>
        </div>

        <div id="screen-map" class="screen">
            <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <div>
                    <h2 class="text-xl font-bold text-white" id="displayName">Name</h2>
                    <p id="displayTopic" class="text-xs text-green-400 mt-1 font-bold">Topic</p>
                </div>
                <div class="text-center">
                    <div class="text-[10px] text-slate-400">PIZZA</div>
                    <div id="pizzaCount" class="font-game text-yellow-400 text-2xl drop-shadow-md">0</div>
                </div>
            </div>
            <div id="partListContainer" class="grid gap-5"></div>
        </div>

        <div id="screen-challenge" class="screen">
            <button onclick="app.goBack()" class="flex items-center gap-2 text-slate-400 mb-4 py-2"><i data-lucide="arrow-left" class="w-5 h-5"></i> Back</button>
            
            <div class="bg-slate-900 rounded-3xl p-5 flex-1 flex flex-col items-center border border-slate-700">
                <div class="w-full mb-4 flex justify-between items-center">
                    <span class="text-green-400 font-bold text-sm uppercase"><i data-lucide="brain" class="inline w-4 h-4 mr-1"></i> Gemini Engine</span>
                    <span class="text-slate-400 text-xs">Target: 95 Pts</span>
                </div>

                <div id="challengeDisplay" class="text-lg text-slate-300 min-h-[120px] bg-slate-800 p-5 rounded-xl w-full text-left leading-relaxed"></div>
                
                <div class="flex-1 flex flex-col items-center justify-center w-full my-8">
                    <div id="energy-orb" class="w-32 h-32 rounded-full flex flex-col items-center justify-center border-4 border-slate-800 transition-all">
                        <i data-lucide="mic" class="w-10 h-10 mb-1 opacity-50 text-white"></i>
                        <span id="orb-status" class="text-[10px] font-bold opacity-50 text-white mt-1">PRESS START</span>
                    </div>
                </div>
                
                <button id="recBtn" onclick="app.toggleRecording()" class="w-full bg-green-500 py-4 rounded-xl font-bold text-lg active:scale-95 flex justify-center items-center shadow-lg transition-all">
                    START RECORDING
                </button>
            </div>
        </div>

        <div id="result-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/95 px-4">
            <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border-2 border-slate-600 text-center shadow-2xl flex flex-col max-h-[90vh]">
                <h2 id="modal-title" class="text-xl font-game text-white mb-2">ANALYZING...</h2>
                <div id="modal-loader" class="my-6">
                    <i data-lucide="loader-2" class="w-12 h-12 text-blue-500 animate-spin mx-auto"></i>
                    <p class="text-slate-400 text-xs mt-4">Gemini AI is checking your pronunciation...</p>
                </div>
                
                <div id="modal-content" class="hidden">
                    <div id="modal-score" class="text-5xl font-game text-green-400 mb-2 drop-shadow-md"></div>
                    <p id="modal-desc" class="text-slate-300 text-sm mb-4 leading-relaxed"></p>
                    
                    <div id="modal-tips" class="bg-slate-900 p-4 rounded-xl mb-6 hidden text-left overflow-y-auto border border-slate-700">
                        <p class="text-xs font-bold text-orange-400 mb-3">⚠️ AI identified errors in:</p>
                        <div id="tips-list" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <button id="closeModalBtn" onclick="document.getElementById('result-modal').classList.add('hidden')" class="w-full bg-slate-600 py-4 rounded-xl font-bold text-white hidden mt-auto">
                    CLOSE
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 核心設定：請在這裡填入妳的 Google AI Studio API Key
        // ==========================================
        const GEMINI_API_KEY = "AIzaSyCV2MrAnWrhfCx9dFXAhZXAAPmDun5bsjw"; 

        // 1. 學生資料庫
        const DB = {
            "Sophia": { topic: "空氣汙染", p: { 1: { t: "Hello everyone! My name is Sophia. Have you ever looked up at the Taichung sky and noticed it looks gray and blurry? That is air pollution. It happens because there are too many factories and cars in our city. When I breathe this dirty air, it makes me feel very angry and sad for our Earth." } } },
            "Linus": { topic: "流浪動物", p: { 1: { t: "Hello everyone! My name is Linus. Today, I want to talk about our furry neighbors—the stray animals of Taichung. During my winter vacation, I rode my bike to a friend’s house, and I saw something on the street that changed my heart forever." } } },
            "Robben": { topic: "包裝與垃圾問題", p: { 1: { t: "Hello everyone! My name is Robben. Today, I want to talk about a hidden problem in Taichung. During my winter vacation, I saw something scary: mountains of packaging from online shopping parcels. It made me realize that our planet is being buried in plastic and paper." } } }
            // 這裡可以繼續把 18 人的資料補齊
        };

        const app = {
            name: "", data: null, part: 1, pizza: 0,
            partProg: { 1: 0 }, 
            mediaRecorder: null, audioChunks: [], isRec: false, stream: null,

            init() {
                const s = document.getElementById('heroSelect');
                Object.keys(DB).forEach(n => s.appendChild(new Option(n, n)));
                lucide.createIcons();
            },

            switch(id) { document.querySelectorAll('.screen').forEach(el => el.classList.remove('active')); document.getElementById(id).classList.add('active'); },
            goBack() { this.switch('screen-map'); },

            login() {
                const n = document.getElementById('heroSelect').value;
                if(!n) return alert("Select hero!");
                this.name = n; this.data = DB[n];
                document.getElementById('displayName').innerText = n;
                document.getElementById('displayTopic').innerText = this.data.topic;
                
                // 從 localStorage 讀取 Pizza 數量
                this.pizza = parseInt(localStorage.getItem(`pizza_${n}`) || 0);
                document.getElementById('pizzaCount').innerText = this.pizza;
                
                this.renderMap();
                this.switch('screen-map');
            },

            renderMap() {
                const c = document.getElementById('partListContainer');
                c.innerHTML = "";
                Object.keys(this.data.p).forEach(pNum => {
                    c.innerHTML += `
                    <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-game text-white text-lg">PART ${pNum}</h3>
                        </div>
                        <button onclick="app.goChallenge(${pNum})" class="w-full bg-green-600 py-4 rounded-xl font-bold text-white flex justify-center items-center shadow-md active:scale-95">
                            <i data-lucide="mic" class="mr-2 w-5 h-5"></i> START AI CHALLENGE
                        </button>
                    </div>`;
                });
                lucide.createIcons();
            },

            goChallenge(p) {
                this.part = p; 
                const txt = this.data.p[p].t;
                // Level 3 盲聽模式：不顯示文字，要求背誦
                document.getElementById('challengeDisplay').innerText = "(BLANK MODE) Speak your script clearly into the mic for Gemini AI to analyze!";
                this.switch('screen-challenge');
            },

            // 🎙️ 真實錄音邏輯
            async toggleRecording() {
                const btn = document.getElementById('recBtn');
                const orb = document.getElementById('energy-orb');
                const orbStatus = document.getElementById('orb-status');

                if (this.isRec) {
                    // 停止錄音
                    this.mediaRecorder.stop();
                    this.stream.getTracks().forEach(track => track.stop());
                    this.isRec = false;
                    
                    btn.innerText = "START RECORDING"; 
                    btn.classList.replace('bg-red-500', 'bg-green-500');
                    orb.classList.remove('recording');
                    orbStatus.innerText = "PRESS START";
                    
                    this.showAnalyzeModal();
                    return;
                }

                if (!GEMINI_API_KEY || GEMINI_API_KEY === "請在這裡貼上妳的API_KEY") {
                    return alert("⚠️ 致命錯誤：請先在程式碼上方填入妳的 GEMINI_API_KEY！");
                }

                try {
                    // 要求真實麥克風權限
                    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.mediaRecorder = new MediaRecorder(this.stream);
                    this.audioChunks = [];

                    this.mediaRecorder.ondataavailable = e => {
                        if (e.data.size > 0) this.audioChunks.push(e.data);
                    };

                    // 錄音結束後觸發：轉換格式並發送給 AI
                    this.mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                        const base64Audio = await this.blobToBase64(audioBlob);
                        this.sendToGeminiAI(base64Audio);
                    };

                    this.mediaRecorder.start();
                    this.isRec = true;
                    btn.innerText = "STOP & ANALYZE"; 
                    btn.classList.replace('bg-green-500', 'bg-red-500');
                    orb.classList.add('recording');
                    orbStatus.innerText = "LISTENING...";
                    
                } catch (e) {
                    alert("⚠️ 麥克風權限被阻擋！請確定妳是用 Netlify Drop 的 HTTPS 網址開啟，而不是直接打開本機檔案。");
                }
            },

            blobToBase64(blob) {
                return new Promise((resolve, _) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
            },

            showAnalyzeModal() {
                document.getElementById('modal-title').innerText = "ANALYZING...";
                document.getElementById('modal-loader').classList.remove('hidden');
                document.getElementById('modal-content').classList.add('hidden');
                document.getElementById('closeModalBtn').classList.add('hidden');
                document.getElementById('result-modal').classList.remove('hidden');
            },

            // 🧠 呼叫 Gemini 1.5 Flash 進行語音聽寫與打分
            async sendToGeminiAI(base64Audio) {
                const expectedText = this.data.p[this.part].t;
                
                // 給 AI 的極度明確指令 (Prompt Engineering)
                const prompt = `You are a strict English pronunciation judge. 
                Listen to the attached audio. The student is trying to recite this script: "${expectedText}"
                1. Did they recite it completely and understandably?
                2. Calculate a score from 0 to 100 based on accuracy and completeness. (If they skipped a lot, score low).
                3. List up to 5 words they mispronounced or missed completely.
                
                Return ONLY a raw JSON object in this exact format, with no markdown formatting or extra text:
                {"score": 95, "feedback": "Great job, but careful with these words.", "missed_words": ["pollution", "factory"]}`;

                const requestBody = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: "audio/webm", data: base64Audio } }
                        ]
                    }]
                };

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();
                    
                    // 擷取 AI 的 JSON 回應
                    let aiText = data.candidates[0].content.parts[0].text;
                    aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim(); // 清理可能的格式
                    const aiResult = JSON.parse(aiText);

                    this.showResult(aiResult.score, aiResult.feedback, aiResult.missed_words);

                } catch (error) {
                    console.error(error);
                    document.getElementById('modal-loader').classList.add('hidden');
                    document.getElementById('modal-title').innerText = "API ERROR";
                    document.getElementById('modal-title').classList.add('text-red-500');
                    document.getElementById('closeModalBtn').classList.remove('hidden');
                    alert("AI 辨識失敗。請確認您的 API Key 是否正確，或網路是否連線。");
                }
            },

            showResult(score, feedback, missedWords) {
                document.getElementById('modal-loader').classList.add('hidden');
                document.getElementById('modal-content').classList.remove('hidden');
                document.getElementById('closeModalBtn').classList.remove('hidden');

                const scoreEl = document.getElementById('modal-score');
                scoreEl.innerText = `${score} / 100`;

                const targetScore = 95;

                if (score >= targetScore) {
                    document.getElementById('modal-title').innerText = "PASSED!";
                    document.getElementById('modal-title').className = "text-3xl font-game text-green-400 mb-2";
                    scoreEl.className = "text-5xl font-game text-green-400 mb-2 drop-shadow-md";
                    
                    this.pizza++;
                    localStorage.setItem(`pizza_${this.name}`, this.pizza);
                    document.getElementById('pizzaCount').innerText = this.pizza;
                    
                    document.getElementById('modal-desc').innerText = "Incredible! You smashed the 95 point target. 1 Pizza earned!";
                } else {
                    document.getElementById('modal-title').innerText = "TRY AGAIN";
                    document.getElementById('modal-title').className = "text-3xl font-game text-orange-500 mb-2";
                    scoreEl.className = "text-5xl font-game text-orange-500 mb-2 drop-shadow-md";
                    document.getElementById('modal-desc').innerText = `You need ${targetScore} points to pass. AI says: ${feedback}`;
                }

                const tipsBox = document.getElementById('modal-tips');
                const tipsList = document.getElementById('tips-list');
                
                if (missedWords && missedWords.length > 0) {
                    tipsBox.classList.remove('hidden');
                    tipsList.innerHTML = missedWords.map(w => 
                        `<button onclick="app.playWord('${w}')" class="bg-slate-800 hover:bg-slate-700 text-orange-300 px-3 py-1.5 rounded-lg text-sm border border-orange-900 transition-all flex items-center">
                            ${w} <i data-lucide="volume-2" class="w-3 h-3 ml-1"></i>
                        </button>`
                    ).join("");
                    lucide.createIcons();
                } else {
                    tipsBox.classList.add('hidden');
                }
            },

            playWord(word) {
                const msg = new SpeechSynthesisUtterance(word);
                msg.lang = 'en-US'; msg.rate = 0.8; 
                window.speechSynthesis.speak(msg);
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
