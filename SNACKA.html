<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seasons AI - 終極實戰版 (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        /* 動態漸層背景 */
        :root { --panel-bg: rgba(30, 41, 59, 0.85); --primary: #22c55e; }
        body { 
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #064e3b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Noto Sans TC', sans-serif; color: #f8fafc; overflow-x: hidden; touch-action: pan-y; 
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .font-game { font-family: 'Bungee', cursive; }
        .screen { display: none; min-height: 100vh; padding: 20px; animation: fadeIn 0.4s ease-out; flex-direction: column; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 玻璃透視面板質感 */
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        
        .karaoke-word { display: inline-block; transition: all 0.15s ease-out; color: #64748b; margin-right: 8px; margin-bottom: 8px; font-size: 1.3rem; }
        .karaoke-word.active { color: #facc15; font-weight: 900; transform: scale(1.15) translateY(-2px); text-shadow: 0 4px 15px rgba(250, 204, 21, 0.6); }

        /* ✨ 老師要求的能量球發光特效 ✨ */
        #energy-orb { transition: all 0.1s ease-out; background: radial-gradient(circle, #4ade80, #15803d); box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        #energy-orb.loud { 
            background: radial-gradient(circle, #facc15, #ea580c); 
            box-shadow: 0 0 50px rgba(234, 88, 12, 0.8); 
            transform: scale(1.4) !important; 
        }
        
        .btn-locked { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
        .tab-btn { transition: all 0.2s; }
        .tab-btn.locked { opacity: 0.4; pointer-events: none; border: 1px dashed #64748b; }

        /* 披薩進化特效 */
        .pizza-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <button onclick="document.getElementById('ai-modal').classList.remove('hidden')" class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(79,70,229,0.6)] z-40 hover:scale-110 transition-all animate-bounce">
        <i data-lucide="bot" class="text-white w-7 h-7"></i>
    </button>

    <div class="max-w-md mx-auto relative min-h-screen pb-10 z-10">
        
        <div id="screen-login" class="screen active justify-center">
            <h1 class="text-6xl font-game text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600 mb-2 text-center drop-shadow-lg">SEASONS</h1>
            <p class="text-green-300 font-bold mb-8 uppercase text-xs text-center tracking-[0.3em]">AI Speaking Center</p>
            
            <div class="glass-panel p-8 rounded-[2rem] w-full relative overflow-hidden">
                <div class="w-full flex flex-col items-center mb-6 min-h-[140px]">
                    <img id="heroAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Seasons" class="w-24 h-24 mb-2 transition-all duration-300 hover:rotate-12">
                    <span id="heroTitle" class="text-[10px] font-black text-blue-300 uppercase tracking-widest bg-blue-900/50 px-3 py-1 rounded-full border border-blue-500/3
