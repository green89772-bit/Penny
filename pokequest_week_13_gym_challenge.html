      /***********************************************************************
       * 6. STAGE 1: LISTEN & SPELL
       ***********************************************************************/
      function setupStage1(idx) {
        clearAllTimers();
        hideBanner();
        if (state.words.length === 0) state.words = JSON.parse(JSON.stringify(DEFAULT_WORDS));
        var total = state.words.length;
        state.s1Idx = ((idx % total) + total) % total;
        var item = state.words[state.s1Idx];
        var letters = item.word.split('').filter(function (c) { return c !== ' '; });
        state.s1Tiles = shuffle(letters);
        state.s1Picked = [];
        state.s1Phase = 'idle';
        state.isTransitioning = false;
        renderStage1();
      }

      function renderStage1() {
        var item = state.words[state.s1Idx];
        var isCaught = state.caught.indexOf(item.word) !== -1;
        var chars = item.word.split('');
        var ptr = 0;

        var slotsHTML = chars.map(function (ch) {
          if (ch === ' ') return '<div class="space-gap">-</div>';
          var tIdx = state.s1Picked[ptr];
          var val = tIdx !== undefined ? state.s1Tiles[tIdx] : '';
          var pos = ptr;
          ptr++;
          var cls = 'letter-slot';
          if (val) cls += (state.s1Phase === 'caught' ? ' solved' : ' filled');
          return '<button class="' + cls + '" data-unpick="' + pos + '">' + val + '</button>';
        }).join('');

        var tilesHTML = state.s1Tiles.map(function (ch, idx) {
          var used = state.s1Picked.indexOf(idx) !== -1 || state.s1Phase !== 'idle' || state.isTransitioning;
          return '<button class="poke-btn letter-tile" data-pick="' + idx + '" ' + (used ? 'disabled' : '') + '>' + ch + '</button>';
        }).join('');

        var pillsHTML = state.words.map(function (w, idx) {
          var c = state.caught.indexOf(w.word) !== -1;
          var cur = idx === state.s1Idx;
          return '<button class="word-pill-dot ' + (c ? 'caught' : '') + ' ' + (cur ? 'current' : '') + '" data-jump="' + idx + '">' +
            '<span>' + (idx + 1) + '</span>' +
            (c ? '<span class="icon-inline">' + svgCheck(12) + '</span>' : '') +
          '</button>';
        }).join('');

        var creatureBox = '';
        if (state.s1Phase === 'idle') {
          creatureBox = '<div class="anim-float">' + svgCreature(item.species, 118) + '</div>' +
            '<div style="background:#0f172a;color:#fde047;font-size:0.84rem;font-weight:900;padding:4px 12px;border-radius:999px;margin-top:6px;">Wild ' + item.poke + '</div>';
        } else if (state.s1Phase === 'throwing') {
          creatureBox = '<div class="anim-wobble">' + svgPokeball(76) + '</div>' +
            '<div style="background:#0f172a;color:#ffffff;font-size:0.84rem;font-weight:900;padding:4px 12px;border-radius:999px;margin-top:8px;">Catching...</div>';
        } else {
          creatureBox = '<div>' + svgPokeball(76) + '</div>' +
            '<div style="background:#fde047;color:#0f172a;border:2px solid #0f172a;font-size:0.9rem;font-weight:900;padding:4px 14px;border-radius:999px;margin-top:8px;">Gotcha! ' + item.poke + '!</div>';
        }

        var vp = document.getElementById('stageViewport');
        vp.innerHTML = '<div class="stage-panel s1-bg">' +
          '<div class="stage-topbar">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
              '<span class="stage-badge-pill" style="background:#4ade80;">WORD ' + (state.s1Idx + 1) + ' / ' + state.words.length + '</span>' +
              '<span style="font-weight:900;font-size:1.05rem;">Listen &amp; Spell</span>' +
              '<span class="timer-pill">' + svgClock(15) + '<span id="stageTimerText">' + formatTime(state.timerSeconds) + '</span></span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<button class="poke-btn btn-red" id="s1PickBtn">' + svgPokeball(18) + '<span>Pick #</span></button>' +
              '<button class="poke-btn btn-yellow" id="s1SpeakBtn">' + svgSpeaker(18) + '<span>Listen</span></button>' +
              '<button class="poke-btn btn-white" id="s1MapBtn">' + svgMapPin(16) + '<span>Map</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="word-pills-bar">' + pillsHTML + '</div>' +

          '<div class="encounter-box">' +
            '<div class="clue-card">' +
              svgWordArt(item.word, 86) +
              (isCaught ? '<div style="background:#dcfce7;color:#166534;font-weight:900;font-size:0.78rem;padding:2px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;">' + svgCheck(12) + ' CAUGHT</div>' : '') +
            '</div>' +
            '<div style="display:flex;flex-direction:column;align-items:center;min-width:150px;">' + creatureBox + '</div>' +
          '</div>' +

          '<div>' +
            '<div class="word-slots" id="s1Slots">' + slotsHTML + '</div>' +
            '<div class="letter-bank">' + tilesHTML + '</div>' +
          '</div>' +

          '<div class="stage-footer">' +
            '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
              '<button class="poke-btn btn-white" id="s1PrevBtn">' + svgArrowLeft(16) + '<span>Prev</span></button>' +
              '<button class="poke-btn btn-white" id="s1UndoBtn" ' + (state.s1Picked.length === 0 || state.s1Phase !== 'idle' ? 'disabled' : '') + '>Undo</button>' +
              '<button class="poke-btn btn-yellow" id="s1ClearBtn">Clear</button>' +
            '</div>' +
            '<button class="poke-btn btn-green ' + (state.s1Phase === 'caught' ? 'anim-pulse-next' : '') + '" id="s1NextBtn">' +
              '<span>' + (state.s1Phase === 'caught' ? 'Next Pokemon' : 'Skip / Next') + '</span>' + svgArrowRight(16) +
            '</button>' +
          '</div>' +
        '</div>';

        document.getElementById('s1PickBtn').addEventListener('click', pickSeatNumber);
        document.getElementById('s1SpeakBtn').addEventListener('click', function () { speakText(item.word); });
        document.getElementById('s1MapBtn').addEventListener('click', function () { goView('map'); });
        document.getElementById('s1PrevBtn').addEventListener('click', function () { playTone('click'); setupStage1(state.s1Idx - 1); });
        document.getElementById('s1UndoBtn').addEventListener('click', function () {
          if (state.s1Phase !== 'idle' || state.isTransitioning || state.s1Picked.length === 0) return;
          playTone('click');
          state.s1Picked.pop();
          hideBanner();
          renderStage1();
        });
        document.getElementById('s1ClearBtn').addEventListener('click', function () { playTone('click'); setupStage1(state.s1Idx); });
        document.getElementById('s1NextBtn').addEventListener('click', function () { playTone('click'); setupStage1(state.s1Idx + 1); });

        vp.querySelectorAll('[data-jump]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            playTone('click');
            setupStage1(parseInt(btn.getAttribute('data-jump'), 10));
          });
        });

        vp.querySelectorAll('[data-pick]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (state.s1Phase !== 'idle' || state.isTransitioning) return;
            var idx = parseInt(btn.getAttribute('data-pick'), 10);
            if (state.s1Picked.indexOf(idx) !== -1) return;
            playTone('click');
            state.s1Picked.push(idx);
            renderStage1();
            checkStage1();
          });
        });

        vp.querySelectorAll('[data-unpick]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (state.s1Phase !== 'idle' || state.isTransitioning) return;
            var pos = parseInt(btn.getAttribute('data-unpick'), 10);
            if (pos < state.s1Picked.length) {
              playTone('click');
              state.s1Picked.splice(pos, 1);
              hideBanner();
              renderStage1();
            }
          });
        });
      }

      function checkStage1() {
        var capturedIdx = state.s1Idx;
        var item = state.words[capturedIdx];
        var target = item.word.replace(/ /g, '').toLowerCase();
        if (state.s1Picked.length < target.length) return;

        var attempt = state.s1Picked.map(function (i) { return state.s1Tiles[i]; }).join('').toLowerCase();
        if (attempt === target) {
          state.isTransitioning = true;
          state.s1Phase = 'throwing';
          playTone('tick');
          renderStage1();

          registerTimer(function () {
            if (state.view !== 'stage1' || state.s1Idx !== capturedIdx) return;
            state.isTransitioning = false;
            state.s1Phase = 'caught';
            speakText(item.word);
            state.streak += 1;
            if (state.caught.indexOf(item.word) === -1) state.caught.push(item.word);
            saveStorage();
            updateHUD();
            renderStage1();

            if (state.caught.length >= state.words.length) {
              registerTimer(function () {
                if (state.view !== 'stage1') return;
                triggerMissionComplete('stage1', 'GYM 1 CLEARED', 'FOREST CATCH BADGE EARNED!');
              }, 600);
            } else {
              playTone('catch');
              var who = state.currentSeat !== null ? ('Trainer #' + state.currentSeat) : 'Trainer';
              showBanner('GOTCHA! ' + who + ' spelled "' + item.word + '" and caught ' + item.poke + '!', 'success');
            }
          }, 1100);
        } else {
          playTone('wrong');
          state.streak = 0;
          saveStorage();
          updateHUD();
          var slots = document.getElementById('s1Slots');
          if (slots) {
            slots.classList.remove('anim-shake');
            void slots.offsetWidth;
            slots.classList.add('anim-shake');
          }
          showBanner('Try again! Tap a letter slot or Undo.', 'error');
        }
      }

      /***********************************************************************
       * 7. STAGE 2: MATCH Q&A (BATTLE ARENA)
       ***********************************************************************/
      function setupStage2() {
        clearAllTimers();
        hideBanner();
        state.s2SelectedQ = null;
        state.s2MatchedIds = [];
        state.s2ShuffledA = shuffle(QA_PAIRS);
        state.s2Beam = false;
        renderStage2();
      }

      function renderStage2() {
        var remaining = QA_PAIRS.length - state.s2MatchedIds.length;
        var hpPct = Math.round((remaining / QA_PAIRS.length) * 100);

        var qHTML = QA_PAIRS.map(function (p) {
          var isMatched = state.s2MatchedIds.indexOf(p.id) !== -1;
          var isSel = state.s2SelectedQ === p.id;
          return '<button class="match-card ' + (isSel ? 'selected' : '') + ' ' + (isMatched ? 'matched' : '') + '" data-q="' + p.id + '" ' + (isMatched ? 'disabled' : '') + '>' +
            '<span>' + p.q + '</span>' +
            (isMatched ? '<span class="icon-inline">' + svgCheck(16) + '</span>' : '<span class="icon-inline">' + svgSpeaker(16) + '</span>') +
          '</button>';
        }).join('');

        var aHTML = state.s2ShuffledA.map(function (p) {
          var isMatched = state.s2MatchedIds.indexOf(p.id) !== -1;
          return '<button class="match-card ' + (isMatched ? 'matched' : '') + '" data-a="' + p.id + '" ' + (isMatched ? 'disabled' : '') + '>' +
            '<span>' + p.a + '</span>' +
            (isMatched ? '<span class="icon-inline">' + svgCheck(16) + '</span>' : '') +
          '</button>';
        }).join('');

        var vp = document.getElementById('stageViewport');
        vp.innerHTML = '<div class="stage-panel s2-bg">' +
          '<div class="stage-topbar">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
              '<span class="stage-badge-pill" style="background:#f472b6;">MATCHED ' + state.s2MatchedIds.length + ' / 6</span>' +
              '<span style="font-weight:900;font-size:1.05rem;">Match Q&amp;A</span>' +
              '<span class="timer-pill">' + svgClock(15) + '<span id="stageTimerText">' + formatTime(state.timerSeconds) + '</span></span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<button class="poke-btn btn-red" id="s2PickBtn">' + svgPokeball(18) + '<span>Pick #</span></button>' +
              '<button class="poke-btn btn-yellow" id="s2ResetBtn">Shuffle &amp; Reset</button>' +
              '<button class="poke-btn btn-white" id="s2MapBtn">' + svgMapPin(16) + '<span>Map</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="battle-stage">' +
            '<div style="display:flex;align-items:center;gap:10px;">' +
              '<div class="anim-float">' + svgCreature('spark', 78) + '</div>' +
              '<div class="hp-box">' +
                '<div style="font-weight:900;font-size:0.86rem;">YOUR PIKACHU</div>' +
                '<div class="hp-track"><div class="hp-fill" style="width:100%;"></div></div>' +
              '</div>' +
            '</div>' +
            (state.s2Beam ? '<div class="beam-effect"></div>' : '') +
            '<div style="display:flex;align-items:center;gap:10px;">' +
              '<div class="hp-box">' +
                '<div style="font-weight:900;font-size:0.86rem;">RIVAL HP: ' + hpPct + '%</div>' +
                '<div class="hp-track"><div class="hp-fill" style="width:' + hpPct + '%;background:' + (hpPct <= 35 ? '#ef4444' : '#f59e0b') + ';"></div></div>' +
              '</div>' +
              '<div class="' + (state.s2Beam ? 'anim-shake' : 'anim-float') + '">' + svgCreature('flame', 78) + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="match-grid">' +
            '<div class="match-col">' + qHTML + '</div>' +
            '<div class="match-col">' + aHTML + '</div>' +
          '</div>' +
        '</div>';

        document.getElementById('s2PickBtn').addEventListener('click', pickSeatNumber);
        document.getElementById('s2ResetBtn').addEventListener('click', function () { playTone('click'); startStageTimer(); setupStage2(); });
        document.getElementById('s2MapBtn').addEventListener('click', function () { goView('map'); });
        vp.querySelectorAll('[data-q]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var qId = parseInt(btn.getAttribute('data-q'), 10);
            var pair = QA_PAIRS.filter(function (x) { return x.id === qId; })[0];
            playTone('click');
            if (pair) speakText(pair.q);
            state.s2SelectedQ = qId;
            renderStage2();
          });
        });

        vp.querySelectorAll('[data-a]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (state.s2SelectedQ === null) {
              showBanner('Select a question on the left first!', '');
              return;
            }
            var aId = parseInt(btn.getAttribute('data-a'), 10);
            var pair = QA_PAIRS.filter(function (x) { return x.id === aId; })[0];
            if (aId === state.s2SelectedQ) {
              state.s2MatchedIds.push(aId);
              state.s2SelectedQ = null;
              state.s2Beam = true;
              state.streak += 1;
              saveStorage();
              updateHUD();
              playTone('catch');
              if (pair) speakText(pair.a);
              renderStage2();

              if (state.s2MatchedIds.length === QA_PAIRS.length) {
                registerTimer(function () {
                  if (state.view !== 'stage2') return;
                  triggerMissionComplete('stage2', 'GYM 2 CLEARED', 'THUNDERBOLT BATTLE BADGE EARNED!');
                }, 700);
              } else {
                var who = state.currentSeat !== null ? ('Trainer #' + state.currentSeat) : 'Trainer';
                showBanner('SUPER EFFECTIVE! ' + who + ': "' + pair.q + '" -> "' + pair.a + '"', 'success');
                registerTimer(function () {
                  if (state.view !== 'stage2') return;
                  state.s2Beam = false;
                  renderStage2();
                }, 650);
              }
            } else {
              playTone('wrong');
              state.streak = 0;
              saveStorage();
              updateHUD();
              showBanner('Not a match! Try another answer.', 'error');
            }
          });
        });
      }

      /***********************************************************************
       * 8. STAGE 3: BUILD THE SENTENCE (EXPRESS TRACK)
       ***********************************************************************/
      function setupStage3(idx) {
        clearAllTimers();
        hideBanner();
        var total = EXPRESS_ITEMS.length;
        state.s3Idx = ((idx % total) + total) % total;
        var item = EXPRESS_ITEMS[state.s3Idx];
        state.s3Bank = shuffle(item.tokens);
        state.s3Built = [];
        state.s3Solved = false;
        renderStage3();
      }

      function renderStage3() {
        var item = EXPRESS_ITEMS[state.s3Idx];

        var builtHTML = state.s3Built.length === 0
          ? '<span style="color:#cbd5e1;font-weight:800;">Tap word blocks below in order...</span>'
          : state.s3Built.map(function (bIdx, pos) {
              return '<button class="word-chip ' + (state.s3Solved ? 'correct' : 'placed') + '" data-remove="' + pos + '">' + state.s3Bank[bIdx] + '</button>';
            }).join('');

        var bankHTML = state.s3Bank.map(function (tok, idx) {
          var used = state.s3Built.indexOf(idx) !== -1 || state.s3Solved;
          return '<button class="poke-btn word-chip" data-add="' + idx + '" ' + (used ? 'disabled' : '') + '>' + tok + '</button>';
        }).join('');

        var vp = document.getElementById('stageViewport');
        vp.innerHTML = '<div class="stage-panel s3-bg">' +
          '<div class="stage-topbar">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
              '<span class="stage-badge-pill" style="background:#38bdf8;">TRACK ' + (state.s3Idx + 1) + ' / ' + EXPRESS_ITEMS.length + '</span>' +
              '<span style="font-weight:900;font-size:1.05rem;">Build the Sentence</span>' +
              '<span class="timer-pill">' + svgClock(15) + '<span id="stageTimerText">' + formatTime(state.timerSeconds) + '</span></span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<button class="poke-btn btn-red" id="s3PickBtn">' + svgPokeball(18) + '<span>Pick #</span></button>' +
              '<button class="poke-btn btn-yellow" id="s3SpeakBtn">' + svgSpeaker(18) + '<span>Listen</span></button>' +
              '<button class="poke-btn btn-white" id="s3MapBtn">' + svgMapPin(16) + '<span>Map</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="track-arena">' +
            '<div class="question-bubble">' + item.q + '</div>' +
            '<div style="display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:14px;">' +
              '<div style="background:#ffffff;border:3px solid #0f172a;border-radius:16px;padding:10px 18px;">' + svgWordArt(item.art, 74) + '</div>' +
              '<div class="anim-float">' + svgCreature('wave', 80) + '</div>' +
            '</div>' +
            '<div class="sentence-dropzone" id="s3Drop">' + builtHTML + '</div>' +
            '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">' + bankHTML + '</div>' +
          '</div>' +

          '<div class="stage-footer">' +
            '<div style="display:flex;gap:8px;">' +
              '<button class="poke-btn btn-white" id="s3PrevBtn">' + svgArrowLeft(16) + '<span>Prev</span></button>' +
              '<button class="poke-btn btn-yellow" id="s3ClearBtn">Clear</button>' +
            '</div>' +
            '<button class="poke-btn btn-green ' + (state.s3Solved ? 'anim-pulse-next' : '') + '" id="s3NextBtn"><span>Next Track</span>' + svgArrowRight(16) + '</button>' +
          '</div>' +
        '</div>';

        document.getElementById('s3PickBtn').addEventListener('click', pickSeatNumber);
        document.getElementById('s3SpeakBtn').addEventListener('click', function () { speakText(item.q); });
        document.getElementById('s3MapBtn').addEventListener('click', function () { goView('map'); });
        document.getElementById('s3PrevBtn').addEventListener('click', function () { playTone('click'); setupStage3(state.s3Idx - 1); });
        document.getElementById('s3ClearBtn').addEventListener('click', function () { playTone('click'); setupStage3(state.s3Idx); });
        document.getElementById('s3NextBtn').addEventListener('click', function () { playTone('click'); setupStage3(state.s3Idx + 1); });

        vp.querySelectorAll('[data-add]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (state.s3Solved) return;
            var idx = parseInt(btn.getAttribute('data-add'), 10);
            if (state.s3Built.indexOf(idx) !== -1) return;
            playTone('click');
            state.s3Built.push(idx);
            renderStage3();
            checkStage3();
          });
        });

        vp.querySelectorAll('[data-remove]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (state.s3Solved) return;
            var pos = parseInt(btn.getAttribute('data-remove'), 10);
            playTone('click');
            state.s3Built.splice(pos, 1);
            hideBanner();
            renderStage3();
          });
        });
      }

      function checkStage3() {
        var item = EXPRESS_ITEMS[state.s3Idx];
        if (state.s3Built.length < item.tokens.length) return;
        var builtTokens = state.s3Built.map(function (i) { return state.s3Bank[i]; });
        var ok = builtTokens.every(function (t, i) { return t === item.tokens[i]; });

        if (ok) {
          state.s3Solved = true;
          state.streak += 1;
          if (state.s3Done.indexOf(state.s3Idx) === -1) state.s3Done.push(state.s3Idx);
          saveStorage();
          updateHUD();
          var sentence = item.tokens.slice(0, 4).join(' ') + '.';
          speakText(sentence);
          renderStage3();

          if (state.s3Done.length >= EXPRESS_ITEMS.length) {
            registerTimer(function () {
              if (state.view !== 'stage3') return;
              triggerMissionComplete('stage3', 'GYM 3 CLEARED', 'EXPRESS WING BADGE EARNED!');
            }, 650);
          } else {
            playTone('catch');
            var who = state.currentSeat !== null ? ('Trainer #' + state.currentSeat) : 'Trainer';
            showBanner('AWESOME! ' + who + ': "' + sentence + '"', 'success');
          }
        } else {
          playTone('wrong');
          state.streak = 0;
          saveStorage();
          updateHUD();
          var dz = document.getElementById('s3Drop');
          if (dz) {
            dz.classList.remove('anim-shake');
            void dz.offsetWidth;
            dz.classList.add('anim-shake');
          }
          showBanner('Check the word order and try again!', 'error');
        }
      }

      /***********************************************************************
       * 9. STAGE 4: LOOK & COMPLETE (CHAMPION GYM)
       ***********************************************************************/
      function setupStage4(idx) {
        clearAllTimers();
        hideBanner();
        var total = SCENE_ITEMS.length;
        state.s4Idx = ((idx % total) + total) % total;
        state.s4Place = '';
        state.s4Transport = '';
        state.s4Solved = false;
        renderStage4();
      }

      function renderStage4() {
        var sc = SCENE_ITEMS[state.s4Idx];
        var fullSentence = sc.subj + ' going to the ' + sc.place + '. ' + sc.subj + ' going ' + sc.transport + '.';

        var placeHTML = PLACE_CHIPS.map(function (p) {
          var act = state.s4Place === p;
          return '<button class="choice-chip ' + (act ? 'active' : '') + '" data-place="' + p + '" ' + (state.s4Solved ? 'disabled' : '') + '>' + p + '</button>';
        }).join('');

        var transHTML = TRANSPORT_CHIPS.map(function (t) {
          var act = state.s4Transport === t;
          return '<button class="choice-chip ' + (act ? 'active' : '') + '" data-trans="' + t + '" ' + (state.s4Solved ? 'disabled' : '') + '>' + t + '</button>';
        }).join('');

        var vp = document.getElementById('stageViewport');
        vp.innerHTML = '<div class="stage-panel s4-bg">' +
          '<div class="stage-topbar">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
              '<span class="stage-badge-pill" style="background:#facc15;">SCENE ' + sc.num + ' / 4</span>' +
              '<span style="font-weight:900;font-size:1.05rem;">Look &amp; Complete</span>' +
              '<span class="timer-pill">' + svgClock(15) + '<span id="stageTimerText">' + formatTime(state.timerSeconds) + '</span></span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<button class="poke-btn btn-red" id="s4PickBtn">' + svgPokeball(18) + '<span>Pick #</span></button>' +
              '<button class="poke-btn btn-yellow" id="s4ReadBtn">' + svgSpeaker(18) + '<span>Read Aloud</span></button>' +
              '<button class="poke-btn btn-white" id="s4MapBtn">' + svgMapPin(16) + '<span>Map</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="scene-card">' +
            '<div class="scene-svg-frame">' + svgScene(sc.num) + '</div>' +
            '<div>' +
              '<div class="sentence-line">' +
                sc.subj + ' going to the <span class="blank-pill ' + (state.s4Solved ? 'solved' : '') + '">' + (state.s4Place || '______') + '</span>.<br/>' +
                sc.subj + ' going <span class="blank-pill ' + (state.s4Solved ? 'solved' : '') + '">' + (state.s4Transport || '______') + '</span>.' +
              '</div>' +

              '<div class="chip-group-label">1. Choose the Place</div>' +
              '<div class="chip-row">' + placeHTML + '</div>' +

              '<div class="chip-group-label">2. Choose How They Go</div>' +
              '<div class="chip-row">' + transHTML + '</div>' +

              '<div style="margin-top:14px;">' +
                '<button class="poke-btn btn-blue" id="s4CheckBtn" ' + (state.s4Solved || !state.s4Place || !state.s4Transport ? 'disabled' : '') + '>Check Answer</button>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="stage-footer">' +
            '<button class="poke-btn btn-white" id="s4PrevBtn">' + svgArrowLeft(16) + '<span>Prev Scene</span></button>' +
            '<button class="poke-btn btn-green ' + (state.s4Solved ? 'anim-pulse-next' : '') + '" id="s4NextBtn"><span>Next Scene</span>' + svgArrowRight(16) + '</button>' +
          '</div>' +
        '</div>';

        document.getElementById('s4PickBtn').addEventListener('click', pickSeatNumber);
        document.getElementById('s4ReadBtn').addEventListener('click', function () {
          var speakStr = state.s4Solved ? fullSentence : (sc.subj + ' going to the ' + (state.s4Place || 'blank') + '. ' + sc.subj + ' going ' + (state.s4Transport || 'blank') + '.');
          speakText(speakStr);
        });
        document.getElementById('s4MapBtn').addEventListener('click', function () { goView('map'); });
        document.getElementById('s4PrevBtn').addEventListener('click', function () { playTone('click'); setupStage4(state.s4Idx - 1); });
        document.getElementById('s4NextBtn').addEventListener('click', function () { playTone('click'); setupStage4(state.s4Idx + 1); });

        vp.querySelectorAll('[data-place]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (state.s4Solved) return;
            playTone('click');
            state.s4Place = btn.getAttribute('data-place');
            renderStage4();
          });
        });

        vp.querySelectorAll('[data-trans]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (state.s4Solved) return;
            playTone('click');
            state.s4Transport = btn.getAttribute('data-trans');
            renderStage4();
          });
        });

        document.getElementById('s4CheckBtn').addEventListener('click', function () {
          if (state.s4Place === sc.place && state.s4Transport === sc.transport) {
            state.s4Solved = true;
            state.streak += 1;
            if (state.s4Done.indexOf(sc.num) === -1) state.s4Done.push(sc.num);
            saveStorage();
            updateHUD();
            speakText(fullSentence);
            renderStage4();

            if (state.s4Done.length >= SCENE_ITEMS.length) {
              registerTimer(function () {
                if (state.view !== 'stage4') return;
                triggerMissionComplete('stage4', 'CHAMPION GYM CLEARED', 'CHAMPION MASTER CROWN BADGE EARNED!');
              }, 650);
            } else {
              playTone('catch');
              var who = state.currentSeat !== null ? ('Trainer #' + state.currentSeat) : 'Trainer';
              showBanner('GREAT JOB! ' + who + ': "' + fullSentence + '"', 'success');
            }
          } else {
            playTone('wrong');
            state.streak = 0;
            saveStorage();
            updateHUD();
            showBanner('Look closely at the picture and try again!', 'error');
          }
        });
      }

      /***********************************************************************
       * 10. MODALS (POKEDEX, LEADERBOARD & TEACHER LAB)
       ***********************************************************************/
      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function renderLeaderboard(tabId) {
        if (tabId) state.lbActiveTab = tabId;
        var tabsEl = document.getElementById('lbTabs');
        var keys = ['stage1', 'stage2', 'stage3', 'stage4'];
        tabsEl.innerHTML = keys.map(function (k) {
          return '<button class="lb-tab ' + (state.lbActiveTab === k ? 'active' : '') + '" data-lb-tab="' + k + '">' + STAGE_LABELS[k] + '</button>';
        }).join('');

        tabsEl.querySelectorAll('[data-lb-tab]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            playTone('click');
            renderLeaderboard(btn.getAttribute('data-lb-tab'));
          });
        });

        var list = state.leaderboard[state.lbActiveTab] || [];
        var contentEl = document.getElementById('lbContent');
        if (list.length === 0) {
          contentEl.innerHTML = '<div style="text-align:center;padding:28px 12px;color:#64748b;font-weight:800;">No scores saved for this stage yet. Complete the Gym to set the first record!</div>';
          return;
        }

        var rows = list.slice(0, 10).map(function (entry, idx) {
          var rank = idx + 1;
          var rCls = rank === 1 ? 'lb-rank-1' : (rank === 2 ? 'lb-rank-2' : (rank === 3 ? 'lb-rank-3' : ''));
          return '<tr>' +
            '<td class="' + rCls + '">#' + rank + '</td>' +
            '<td>' + escapeHtml(entry.name) + '</td>' +
            '<td style="font-variant-numeric:tabular-nums;">' + escapeHtml(entry.formatted) + '</td>' +
          '</tr>';
        }).join('');

        contentEl.innerHTML = '<table class="lb-table">' +
          '<thead><tr><th>Rank</th><th>Trainer Name</th><th>Time</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>';
      }

      function openLeaderboardModal(tabId) {
        playTone('click');
        renderLeaderboard(tabId || state.lbActiveTab);
        document.getElementById('lbModal').classList.add('open');
      }

      function renderPokedex() {
        var grid = document.getElementById('dexGrid');
        grid.innerHTML = state.words.map(function (w) {
          var isCaught = state.caught.indexOf(w.word) !== -1;
          return '<div class="dex-item ' + (isCaught ? 'caught' : 'locked') + '">' +
            '<div>' + svgCreature(w.species, 64) + '</div>' +
            '<div style="font-weight:900;font-size:0.86rem;margin-top:4px;">' + w.poke + '</div>' +
            '<div style="font-size:0.78rem;font-weight:800;color:#475569;">' + (isCaught ? w.word : '???') + '</div>' +
          '</div>';
        }).join('');
      }

      function renderLab() {
        document.getElementById('classSizeInput').value = state.classSize;
        var left = Math.max(0, state.classSize - state.drawnSeats.length);
        document.getElementById('seatPoolStatus').textContent = 'Seats remaining before pool resets: ' + left + ' / ' + state.classSize;
        document.getElementById('customWordMsg').textContent = '';
        state.clearLbConfirming = false;
        renderClearLbArea();
      }

      function renderClearLbArea() {
        var area = document.getElementById('clearLbArea');
        if (!area) return;
        if (!state.clearLbConfirming) {
          area.innerHTML = '<button class="poke-btn btn-red" id="clearLbBtn">Clear Leaderboard</button>';
          document.getElementById('clearLbBtn').addEventListener('click', function () {
            playTone('click');
            state.clearLbConfirming = true;
            document.getElementById('clearLbMsg').textContent = 'Are you sure? This will delete all saved Top Trainers records.';
            renderClearLbArea();
          });
        } else {
          area.innerHTML = '<button class="poke-btn btn-red" id="confirmClearLbBtn">Yes, Clear All Records</button>' +
            '<button class="poke-btn btn-white" id="cancelClearLbBtn">Cancel</button>';
          document.getElementById('confirmClearLbBtn').addEventListener('click', function () {
            state.leaderboard = { stage1: [], stage2: [], stage3: [], stage4: [] };
            saveLeaderboard();
            state.clearLbConfirming = false;
            document.getElementById('clearLbMsg').textContent = 'All leaderboard records have been cleared.';
            renderClearLbArea();
            playTone('catch');
          });
          document.getElementById('cancelClearLbBtn').addEventListener('click', function () {
            state.clearLbConfirming = false;
            document.getElementById('clearLbMsg').textContent = '';
            renderClearLbArea();
            playTone('click');
          });
        }
      }

      /***********************************************************************
       * 11. BOOTSTRAP
       ***********************************************************************/
      window.addEventListener('DOMContentLoaded', function () {
        // Mount static HUD SVG icons
        document.getElementById('brandBallIcon').innerHTML = svgPokeball(34);
        document.getElementById('topPickBall').innerHTML = svgPokeball(20);
        document.getElementById('streakBoltIcon').innerHTML = svgBolt(18);
        document.getElementById('dexBookIcon').innerHTML = svgBook(18);
        document.getElementById('lbTrophyIcon').innerHTML = svgTrophy(18);
        document.getElementById('lbModalIcon').innerHTML = svgTrophy(22);
        document.getElementById('newPlayerIcon').innerHTML = svgReset(18);
        document.getElementById('labFlaskIcon').innerHTML = svgFlask(18);

        loadStorage();
        updateHUD();
        renderNav();
        renderMap();

        document.getElementById('brandHomeBtn').addEventListener('click', function () { goView('map'); });
        document.getElementById('topPickBtn').addEventListener('click', pickSeatNumber);
        document.getElementById('newPlayerBtn').addEventListener('click', resetCurrentPlayer);
        document.getElementById('closeBannerBtn').addEventListener('click', hideBanner);

        // Leaderboard Modal
        document.getElementById('openLbBtn').addEventListener('click', function () {
          openLeaderboardModal();
        });
        document.getElementById('closeLbBtn').addEventListener('click', function () {
          document.getElementById('lbModal').classList.remove('open');
        });

        // Pokedex Modal
        document.getElementById('openDexBtn').addEventListener('click', function () {
          playTone('click');
          renderPokedex();
          document.getElementById('dexModal').classList.add('open');
        });
        document.getElementById('closeDexBtn').addEventListener('click', function () {
          document.getElementById('dexModal').classList.remove('open');
        });

        // Teacher Lab Modal
        document.getElementById('openLabBtn').addEventListener('click', function () {
          playTone('click');
          renderLab();
          document.getElementById('labModal').classList.add('open');
        });
        document.getElementById('closeLabBtn').addEventListener('click', function () {
          document.getElementById('labModal').classList.remove('open');
        });

        document.getElementById('saveClassSizeBtn').addEventListener('click', function () {
          var val = parseInt(document.getElementById('classSizeInput').value, 10);
          if (isNaN(val) || val < 1) val = 1;
          if (val > 45) val = 45;
          state.classSize = val;
          state.drawnSeats = state.drawnSeats.filter(function (n) { return n <= val; });
          saveStorage();
          renderLab();
          playTone('click');
        });

        document.getElementById('resetSeatPoolBtn').addEventListener('click', function () {
          state.drawnSeats = [];
          state.currentSeat = null;
          saveStorage();
          updateHUD();
          renderLab();
          playTone('click');
        });

        document.getElementById('addWordBtn').addEventListener('click', function () {
          var inp = document.getElementById('customWordInput');
          var raw = inp.value.trim().toLowerCase().replace(/[^a-z ]/g, '');
          if (!raw) return;
          var speciesList = ['spark', 'leaf', 'flame', 'wave'];
          state.words.push({
            word: raw,
            poke: 'Wild Star',
            species: speciesList[state.words.length % speciesList.length]
          });
          inp.value = '';
          saveStorage();
          updateHUD();
          document.getElementById('customWordMsg').textContent = 'Added "' + raw + '" to Listen & Spell!';
          playTone('catch');
        });

        document.getElementById('resetAllBtn').addEventListener('click', function () {
          state.words = JSON.parse(JSON.stringify(DEFAULT_WORDS));
          state.drawnSeats = [];
          document.getElementById('labModal').classList.remove('open');
          resetCurrentPlayer();
        });

        // Ceremony Buttons & Save Score
        document.getElementById('saveScoreBtn').addEventListener('click', function () {
          if (state.ceremonySaved || !state.ceremonyStageId) return;
          var nameInp = document.getElementById('trainerNameInput');
          var cleanName = nameInp.value.trim() || (state.currentSeat !== null ? ('Trainer #' + state.currentSeat) : 'Trainer');
          var entry = {
            name: cleanName,
            seconds: state.ceremonyTimeSec,
            formatted: formatTime(state.ceremonyTimeSec)
          };
          var list = state.leaderboard[state.ceremonyStageId] || [];
          list.push(entry);
          list.sort(function (a, b) { return a.seconds - b.seconds; });
          state.leaderboard[state.ceremonyStageId] = list.slice(0, 10);
          saveLeaderboard();
          state.ceremonySaved = true;

          nameInp.disabled = true;
          document.getElementById('saveScoreBtn').disabled = true;
          document.getElementById('saveScoreConfirm').style.display = 'flex';
          playTone('catch');
        });

        document.getElementById('viewTopTrainersBtn').addEventListener('click', function () {
          var targetTab = state.ceremonyStageId || 'stage1';
          closeCeremony();
          openLeaderboardModal(targetTab);
        });

        document.getElementById('replayFanfareBtn').addEventListener('click', function () {
          launchConfetti();
          playCeremonyFanfare();
        });
        document.getElementById('ceremonyBackMapBtn').addEventListener('click', function () {
          closeCeremony();
          goView('map');
        });

        // Keyboard shortcuts for Stage 1
        document.addEventListener('keydown', function (e) {
          if (state.view !== 'stage1') return;
          if (document.getElementById('labModal').classList.contains('open')) return;
          if (document.getElementById('dexModal').classList.contains('open')) return;
          if (document.getElementById('ceremonyOverlay').classList.contains('open')) return;

          if ((e.key === 'Enter' || e.key === ' ') && state.s1Phase === 'caught' && !state.isTransitioning) {
            e.preventDefault();
            playTone('click');
            setupStage1(state.s1Idx + 1);
          } else if (e.key === 'Backspace' && state.s1Phase === 'idle' && !state.isTransitioning && state.s1Picked.length > 0) {
            e.preventDefault();
            playTone('click');
            state.s1Picked.pop();
            hideBanner();
            renderStage1();
          }
        });
      });
    })();
  </script>
</body>
</html>
