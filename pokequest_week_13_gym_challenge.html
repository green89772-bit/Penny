<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeQuest: Week 13 Gym Challenge!</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --accent-yellow: #facc15;
      --accent-gold: #eab308;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-purple: #a855f7;
      --text-light: #f8fafc;
      --text-dark: #0f172a;
      --border-thick: 3px solid #0f172a;
      --shadow-card: 0 6px 0 rgba(15, 23, 42, 0.75);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Segoe UI", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0b1120 0%, #172554 50%, #1e1b4b 100%);
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      user-select: none;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .icon-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Tactile Game Buttons */
    .poke-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 14px;
      border: 3px solid #0f172a;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 4px 0 #0f172a;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
    }

    .poke-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f172a;
    }

    .btn-red { background: linear-gradient(180deg, #f87171, #dc2626); color: #ffffff; }
    .btn-yellow { background: linear-gradient(180deg, #fde047, #eab308); color: #0f172a; }
    .btn-green { background: linear-gradient(180deg, #4ade80, #16a34a); color: #0f172a; }
    .btn-blue { background: linear-gradient(180deg, #60a5fa, #2563eb); color: #ffffff; }
    .btn-white { background: linear-gradient(180deg, #ffffff, #e2e8f0); color: #0f172a; }
    .btn-dark { background: linear-gradient(180deg, #334155, #1e293b); color: #ffffff; }

    /* Top HUD */
    .hud-header {
      background: rgba(15, 23, 42, 0.94);
      border-bottom: 4px solid #facc15;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fde047;
      text-shadow: 2px 2px 0 #0f172a;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.72rem;
      font-weight: 800;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 2px solid #334155;
      background: #1e293b;
      font-weight: 800;
      font-size: 0.9rem;
      color: #f8fafc;
    }

    .trainer-badge {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      border-color: #60a5fa;
      color: #ffffff;
      min-width: 120px;
      justify-content: center;
    }

    .streak-badge {
      background: linear-gradient(135deg, #7c2d12, #9a3412);
      border-color: #fb923c;
      color: #ffedd5;
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 2px solid #facc15;
      background: #0f172a;
      color: #fde047;
      font-weight: 900;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    /* Hall of Fame Leaderboard */
    .lb-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .lb-tab {
      padding: 8px 10px;
      border-radius: 10px;
      border: 2px solid #0f172a;
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 800;
      font-size: 0.82rem;
      text-align: center;
    }

    .lb-tab.active {
      background: #facc15;
      box-shadow: 0 3px 0 #0f172a;
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.92rem;
    }

    .lb-table th,
    .lb-table td {
      padding: 8px 10px;
      border-bottom: 2px solid #e2e8f0;
      text-align: left;
      font-weight: 800;
    }

    .lb-table th {
      background: #f1f5f9;
      color: #334155;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .lb-rank-1 { color: #b45309; }
    .lb-rank-2 { color: #475569; }
    .lb-rank-3 { color: #9a3412; }

    .score-save-box {
      background: rgba(15, 23, 42, 0.72);
      border: 2px solid #60a5fa;
      border-radius: 16px;
      padding: 12px 14px;
      margin: 10px 0 16px;
      text-align: left;
    }

    /* Navigation Tabs */
    .stage-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px 4px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    .nav-tab {
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      font-weight: 800;
      font-size: 0.86rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-tab.active {
      background: #facc15;
      color: #0f172a;
      border-color: #0f172a;
      box-shadow: 0 3px 0 #0f172a;
    }

    .nav-tab.cleared {
      border-color: #4ade80;
    }

    /* Main Viewport */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Feedback Banner */
    .feedback-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 16px;
      border: 3px solid #0f172a;
      background: linear-gradient(90deg, #fef08a, #fde047);
      color: #0f172a;
      box-shadow: 0 5px 0 rgba(15, 23, 42, 0.7);
      font-weight: 800;
      animation: popIn 0.22s ease-out;
    }

    .feedback-banner.show {
      display: flex;
    }

    .feedback-banner.error {
      background: linear-gradient(90deg, #fecaca, #fca5a5);
    }

    .feedback-banner.success {
      background: linear-gradient(90deg, #bbf7d0, #86efac);
    }

    /* Region Map */
    .map-hero {
      background: linear-gradient(145deg, #065f46 0%, #047857 45%, #0284c7 100%);
      border: 4px solid #0f172a;
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .map-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .map-title {
      font-size: 1.7rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 2px 3px 0 #0f172a;
    }

    .badge-case {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.75);
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid #facc15;
    }

    .badge-slot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px dashed #64748b;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-slot.earned {
      border-style: solid;
      border-color: #fde047;
      background: #1e293b;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
    }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .gym-card {
      background: #ffffff;
      color: #0f172a;
      border: 4px solid #0f172a;
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 6px 0 #0f172a;
      transition: transform 0.15s ease;
      cursor: pointer;
    }

    .gym-card:hover {
      transform: translateY(-4px);
    }

    .gym-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      border: 2px solid #0f172a;
      text-transform: uppercase;
    }

    /* Stage Containers */
    .stage-panel {
      border: 4px solid #0f172a;
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .s1-bg { background: linear-gradient(165deg, #065f46 0%, #047857 50%, #0f766e 100%); }
    .s2-bg { background: linear-gradient(165deg, #4c1d95 0%, #6d28d9 50%, #9f1239 100%); }
    .s3-bg { background: linear-gradient(165deg, #0369a1 0%, #0284c7 55%, #1d4ed8 100%); }
    .s4-bg { background: linear-gradient(165deg, #78350f 0%, #b45309 50%, #92400e 100%); }

    .stage-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 23, 42, 0.72);
      padding: 10px 14px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .stage-badge-pill {
      font-weight: 900;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 8px;
      color: #0f172a;
    }

    .stage-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
    }

    /* Stage 1: Listen & Spell */
    .word-pills-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .word-pill-dot {
      min-width: 38px;
      height: 32px;
      padding: 0 8px;
      border-radius: 999px;
      border: 2px solid #0f172a;
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      font-size: 0.82rem;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .word-pill-dot.caught {
      background: #4ade80;
      color: #052e16;
    }

    .word-pill-dot.current {
      background: #facc15;
      color: #0f172a;
      transform: scale(1.1);
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.45);
    }

    .encounter-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-around;
      gap: 18px;
      background: rgba(255, 255, 255, 0.14);
      border: 3px solid rgba(15, 23, 42, 0.65);
      border-radius: 20px;
      padding: 18px;
    }

    .clue-card {
      background: #ffffff;
      border: 4px solid #0f172a;
      border-radius: 20px;
      padding: 16px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 170px;
    }

    .word-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .letter-slot {
      width: 52px;
      height: 58px;
      border-radius: 14px;
      border: 3px dashed #ffffff;
      background: rgba(15, 23, 42, 0.45);
      color: #ffffff;
      font-size: 1.7rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: lowercase;
    }

    .letter-slot.filled {
      border-style: solid;
      border-color: #0f172a;
      background: #fde047;
      color: #0f172a;
    }

    .letter-slot.solved {
      border-style: solid;
      border-color: #0f172a;
      background: #4ade80;
      color: #0f172a;
    }

    .space-gap {
      width: 24px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fde047;
      font-weight: 900;
      font-size: 1.5rem;
    }

    .letter-bank {
      background: rgba(15, 23, 42, 0.82);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .letter-tile {
      width: 54px;
      height: 54px;
      font-size: 1.55rem;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff, #e2e8f0);
      color: #0f172a;
      padding: 0;
    }

    /* Stage 2: Battle Arena */
    .battle-stage {
      background: rgba(15, 23, 42, 0.65);
      border: 3px solid #0f172a;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .hp-box {
      background: #ffffff;
      color: #0f172a;
      border: 3px solid #0f172a;
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 170px;
    }

    .hp-track {
      height: 14px;
      background: #e2e8f0;
      border: 2px solid #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 0.35s ease;
    }

    .beam-effect {
      position: absolute;
      left: 22%;
      right: 22%;
      top: 50%;
      height: 16px;
      margin-top: -8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #facc15, #f97316, #ef4444);
      box-shadow: 0 0 22px #fde047;
      animation: beamBlast 0.55s ease-out;
      pointer-events: none;
    }

    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 720px) {
      .match-grid { grid-template-columns: 1fr; }
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-card {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 16px;
      border: 3px solid #0f172a;
      background: #ffffff;
      color: #0f172a;
      font-weight: 800;
      font-size: 1.02rem;
      box-shadow: 0 4px 0 #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .match-card.selected {
      background: #fef08a;
      border-color: #eab308;
      transform: scale(1.02);
    }

    .match-card.matched {
      background: #bbf7d0;
      color: #14532d;
      opacity: 0.72;
      box-shadow: none;
    }

    /* Stage 3: Express Track */
    .track-arena {
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid #0f172a;
      border-radius: 20px;
      padding: 18px;
      text-align: center;
    }

    .question-bubble {
      display: inline-block;
      background: #ffffff;
      color: #0f172a;
      border: 4px solid #0f172a;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 1.45rem;
      font-weight: 900;
      margin-bottom: 14px;
      box-shadow: 0 4px 0 #0f172a;
    }

    .sentence-dropzone {
      min-height: 76px;
      background: rgba(15, 23, 42, 0.65);
      border: 3px dashed #fde047;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .word-chip {
      padding: 12px 18px;
      border-radius: 14px;
      border: 3px solid #0f172a;
      background: #ffffff;
      color: #0f172a;
      font-size: 1.15rem;
      font-weight: 900;
      box-shadow: 0 4px 0 #0f172a;
    }

    .word-chip.placed {
      background: #fde047;
    }

    .word-chip.correct {
      background: #4ade80;
    }

    /* Stage 4: Look & Complete */
    .scene-card {
      background: #ffffff;
      color: #0f172a;
      border: 4px solid #0f172a;
      border-radius: 22px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 18px;
      align-items: center;
    }

    @media (max-width: 800px) {
      .scene-card { grid-template-columns: 1fr; }
    }

    .scene-svg-frame {
      background: #f8fafc;
      border: 3px solid #0f172a;
      border-radius: 16px;
      overflow: hidden;
      width: 100%;
    }

    .scene-svg-frame svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .sentence-line {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 2.1;
      color: #0f172a;
    }

    .blank-pill {
      display: inline-block;
      min-width: 126px;
      padding: 2px 12px;
      border-bottom: 4px solid #0f172a;
      background: #fef9c3;
      border-radius: 8px 8px 0 0;
      text-align: center;
      color: #1d4ed8;
    }

    .blank-pill.solved {
      background: #bbf7d0;
      color: #15803d;
    }

    .chip-group-label {
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #475569;
      margin: 10px 0 6px;
      letter-spacing: 0.6px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-chip {
      padding: 9px 14px;
      border-radius: 12px;
      border: 3px solid #0f172a;
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 800;
      font-size: 0.98rem;
      box-shadow: 0 3px 0 #0f172a;
    }

    .choice-chip.active {
      background: #fde047;
      transform: translateY(-2px);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      color: #0f172a;
      border: 4px solid #0f172a;
      border-radius: 22px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 0 #0f172a;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .dex-item {
      border: 3px solid #0f172a;
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      background: #f8fafc;
    }

    .dex-item.caught {
      background: #dcfce7;
    }

    .dex-item.locked {
      opacity: 0.55;
      filter: grayscale(1);
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 3px solid #0f172a;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 6px;
    }

    /* Ceremonial Mission Complete Overlay */
    .ceremony-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(30, 58, 138, 0.96), rgba(15, 23, 42, 0.98));
      overflow: hidden;
      padding: 18px;
    }

    .ceremony-overlay.open {
      display: flex;
    }

    .starburst-rays {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140vmax;
      height: 140vmax;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(250, 204, 21, 0.22) 0deg 15deg,
        transparent 15deg 30deg
      );
      animation: rotateRays 16s linear infinite;
      pointer-events: none;
    }

    .ceremony-card {
      position: relative;
      z-index: 2;
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
      border: 5px solid #facc15;
      border-radius: 28px;
      padding: 28px 24px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 50px rgba(250, 204, 21, 0.45), 0 10px 0 #020617;
      animation: popIn 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
    }

    .ceremony-title {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #fef08a 0%, #facc15 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 0 #0f172a);
      margin-bottom: 6px;
    }

    .ceremony-badge-wrap {
      margin: 14px auto;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stampIn 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .ceremony-stars {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 12px 0 16px;
    }

    .ceremony-star {
      opacity: 0.25;
      transform: scale(0.7);
      transition: all 0.35s cubic-bezier(0.2, 1.5, 0.4, 1);
    }

    .ceremony-star.lit {
      opacity: 1;
      transform: scale(1.18);
      filter: drop-shadow(0 0 12px #facc15);
    }

    .confetti-piece {
      position: fixed;
      top: -16px;
      width: 12px;
      height: 12px;
      z-index: 85;
      pointer-events: none;
      animation: confettiFall 2.8s linear forwards;
    }

    /* Keyframes */
    @keyframes popIn {
      0% { transform: scale(0.88); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .anim-float { animation: floatIdle 2.2s ease-in-out infinite; }

    @keyframes wobbleBall {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-18deg); }
      75% { transform: rotate(18deg); }
    }
    .anim-wobble { animation: wobbleBall 0.42s ease-in-out infinite; }

    @keyframes spinFast {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .anim-spin { animation: spinFast 0.32s linear infinite; }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .anim-shake { animation: shakeWrong 0.32s ease-in-out; }

    @keyframes beamBlast {
      0% { transform: scaleX(0.1); opacity: 0.6; }
      50% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1.05); opacity: 0; }
    }

    @keyframes pulseNext {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.75), 0 4px 0 #0f172a; }
      50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(74, 222, 128, 0), 0 6px 0 #0f172a; }
    }
    .anim-pulse-next { animation: pulseNext 1.2s ease-in-out infinite; }

    @keyframes rotateRays {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes stampIn {
      0% { transform: scale(2.2) rotate(-18deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(540deg); opacity: 0.2; }
    }
  </style>
</head>

      /***********************************************************************
       * 2. AUDIO ENGINE (WEB AUDIO SYNTH + WEB SPEECH API)
       ***********************************************************************/
      var audioCtx = null;
      function getAudio() {
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
        return audioCtx;
      }

      function playTone(type) {
        var ctx = getAudio();
        if (!ctx) return;
        try {
          var now = ctx.currentTime;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.06);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.start(now);
            osc.stop(now + 0.07);
          } else if (type === 'tick') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(660, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
          } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.22);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            osc.start(now);
            osc.stop(now + 0.24);
          } else if (type === 'star') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(1320, now + 0.14);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.start(now);
            osc.stop(now + 0.16);
          } else if (type === 'catch') {
            var notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach(function (f, i) {
              var o = ctx.createOscillator();
              var g = ctx.createGain();
              o.type = 'triangle';
              o.connect(g);
              g.connect(ctx.destination);
              o.frequency.setValueAtTime(f, now + i * 0.09);
              g.gain.setValueAtTime(0.14, now + i * 0.09);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.18);
              o.start(now + i * 0.09);
              o.stop(now + i * 0.09 + 0.18);
            });
          }
        } catch (e) {}
      }

      function playCeremonyFanfare() {
        var ctx = getAudio();
        if (!ctx) return;
        try {
          var now = ctx.currentTime;
          var melody = [
            { f: 523.25, t: 0.0, d: 0.14 },
            { f: 659.25, t: 0.14, d: 0.14 },
            { f: 783.99, t: 0.28, d: 0.14 },
            { f: 1046.5, t: 0.44, d: 0.34 },
            { f: 880.0, t: 0.80, d: 0.14 },
            { f: 1046.5, t: 0.96, d: 0.55 }
          ];
          melody.forEach(function (n) {
            var o = ctx.createOscillator();
            var g = ctx.createGain();
            o.type = 'square';
            o.connect(g);
            g.connect(ctx.destination);
            o.frequency.setValueAtTime(n.f, now + n.t);
            g.gain.setValueAtTime(0.1, now + n.t);
            g.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
            o.start(now + n.t);
            o.stop(now + n.t + n.d);
          });
        } catch (e) {}
      }

      function speakText(text) {
        try {
          if (!('speechSynthesis' in window)) {
            playTone('tick');
            return;
          }
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(String(text));
          u.lang = 'en-US';
          u.rate = 0.88;
          window.speechSynthesis.speak(u);
        } catch (e) {
          playTone('tick');
        }
      }

      var TRANSPORT_CHIPS = ['by bus', 'by car', 'by taxi', 'by train'];

      var STAGE_LABELS = {
        stage1: 'Stage 1: Listen & Spell',
        stage2: 'Stage 2: Match Q&A',
        stage3: 'Stage 3: Build the Sentence',
        stage4: 'Stage 4: Look & Complete'
      };

      var STORAGE_KEY = 'pokequest_w13_solo_v5';
      var LEADERBOARD_KEY = 'pokequest_w13_leaderboard_v1';

      var state = {
        view: 'map',
        classSize: 25,
        drawnSeats: [],
        currentSeat: null,
        isDrawing: false,
        streak: 0,
        words: JSON.parse(JSON.stringify(DEFAULT_WORDS)),
        caught: [],
        badges: [],

        // Leaderboard & Timer
        leaderboard: { stage1: [], stage2: [], stage3: [], stage4: [] },
        lbActiveTab: 'stage1',
        timerSeconds: 0,
        timerRunning: false,
        ceremonyStageId: null,
        ceremonyTimeSec: 0,
        ceremonySaved: false,
        clearLbConfirming: false,

        // Stage 1

        s1Tiles: [],

      };

      var pendingTimers = [];
      var stageTimerInterval = null;

      function formatTime(sec) {
        var s = Math.max(0, Math.floor(sec || 0));
        var mm = Math.floor(s / 60);
        var ss = s % 60;
        return (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
      }

      function stopStageTimer() {
        if (stageTimerInterval) {
          clearInterval(stageTimerInterval);
          stageTimerInterval = null;
        }
        state.timerRunning = false;
      }

      function startStageTimer() {
        stopStageTimer();
        state.timerSeconds = 0;
        state.timerRunning = true;
        updateTimerDisplay();
        stageTimerInterval = setInterval(function () {
          if (!state.timerRunning) return;
          state.timerSeconds += 1;
          updateTimerDisplay();
        }, 1000);
      }

      function updateTimerDisplay() {
        var el = document.getElementById('stageTimerText');
        if (el) el.textContent = formatTime(state.timerSeconds);
      }

      function registerTimer(fn, ms) {
        var id = setTimeout(function () {
          pendingTimers = pendingTimers.filter(function (t) { return t !== id; });
          fn();
        }, ms);
        pendingTimers.push(id);
        return id;
      }

      function clearAllTimers() {
        while (pendingTimers.length > 0) {
          clearTimeout(pendingTimers.pop());
        }
        state.isTransitioning = false;
      }

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function loadStorage() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var d = JSON.parse(raw);
            if (typeof d.classSize === 'number') state.classSize = Math.min(45, Math.max(1, d.classSize));
            if (Array.isArray(d.drawnSeats)) state.drawnSeats = d.drawnSeats;
            if (typeof d.currentSeat === 'number') state.currentSeat = d.currentSeat;
            if (typeof d.streak === 'number') state.streak = d.streak;
            if (Array.isArray(d.words) && d.words.length > 0) state.words = d.words;
            if (Array.isArray(d.caught)) state.caught = d.caught;
            if (Array.isArray(d.badges)) state.badges = d.badges;
          }
        } catch (e) {}
        try {
          var lbRaw = localStorage.getItem(LEADERBOARD_KEY);
          if (lbRaw) {
            var lb = JSON.parse(lbRaw);
            ['stage1', 'stage2', 'stage3', 'stage4'].forEach(function (k) {
              if (Array.isArray(lb[k])) state.leaderboard[k] = lb[k];
            });
          }
        } catch (e) {}
      }

      function saveStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            classSize: state.classSize,
            drawnSeats: state.drawnSeats,
            currentSeat: state.currentSeat,
            streak: state.streak,
            words: state.words,
            caught: state.caught,
            badges: state.badges
          }));
        } catch (e) {}
      }

      function saveLeaderboard() {
        try {
          localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(state.leaderboard));
        } catch (e) {}
      }

      function resetCurrentPlayer() {
        clearAllTimers();
        stopStageTimer();
        state.caught = [];
        state.badges = [];
        state.streak = 0;
        state.currentSeat = null;
        state.s1Idx = 0;
        state.s2SelectedQ = null;
        state.s2MatchedIds = [];
        state.s3Idx = 0;
        state.s3Done = [];
        state.s4Idx = 0;
        state.s4Done = [];
        saveStorage();
        updateHUD();
        goView('map');
        showBanner('Ready for a New Player! All stage progress has been reset.', 'success');
      }

      function saveStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            classSize: state.classSize,
            drawnSeats: state.drawnSeats,
            currentSeat: state.currentSeat,
            streak: state.streak,
            words: state.words,
            caught: state.caught,
            badges: state.badges
          }));
        } catch (e) {}
      }

      /***********************************************************************
       * 4. HUD, SEAT PICKER, FEEDBACK & CEREMONY
       ***********************************************************************/
      function updateHUD() {
        var tEl = document.getElementById('trainerDisplay');
        if (tEl) tEl.textContent = state.currentSeat !== null ? ('Trainer #' + state.currentSeat) : 'Trainer #--';
        var sEl = document.getElementById('streakDisplay');
        if (sEl) sEl.innerHTML = '<span class="icon-inline">' + svgBolt(18) + '</span><span>STREAK: ' + state.streak + '</span>';
        var dEl = document.getElementById('dexCountText');
        if (dEl) dEl.textContent = 'Pokedex ' + state.caught.length + '/' + state.words.length;
      }

      function showBanner(msg, mode) {
        var b = document.getElementById('feedbackBanner');
        var t = document.getElementById('feedbackText');
        if (!b || !t) return;
        b.className = 'feedback-banner show' + (mode ? ' ' + mode : '');
        t.textContent = msg;
      }

      function hideBanner() {
        var b = document.getElementById('feedbackBanner');
        if (b) b.className = 'feedback-banner';
      }

      function pickSeatNumber() {
        if (state.isDrawing) return;
        state.isDrawing = true;

        var available = [];
        for (var i = 1; i <= state.classSize; i++) {
          if (state.drawnSeats.indexOf(i) === -1) available.push(i);
        }
        if (available.length === 0) {
          state.drawnSeats = [];
          for (var j = 1; j <= state.classSize; j++) available.push(j);
        }

        var ballIcon = document.getElementById('topPickBall');
        if (ballIcon) ballIcon.classList.add('anim-spin');

        var ticks = 0;
        var interval = setInterval(function () {
          ticks++;
          playTone('tick');
          var preview = Math.floor(Math.random() * state.classSize) + 1;
          var tEl = document.getElementById('trainerDisplay');
          if (tEl) tEl.textContent = 'Trainer #' + preview;

          if (ticks >= 10) {
            clearInterval(interval);
            if (ballIcon) ballIcon.classList.remove('anim-spin');
            var picked = available[Math.floor(Math.random() * available.length)];
            state.currentSeat = picked;
            state.drawnSeats.push(picked);
            state.isDrawing = false;
            saveStorage();
            updateHUD();
            playTone('catch');
            showBanner('Trainer #' + picked + ', it is your turn!', 'success');
          }
        }, 55);
      }

      function launchConfetti() {
        var colors = ['#facc15', '#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#ffffff'];
        for (var i = 0; i < 42; i++) {
          var el = document.createElement('div');
          el.className = 'confetti-piece';
          el.style.left = Math.floor(Math.random() * 100) + 'vw';
          el.style.background = colors[i % colors.length];
          el.style.animationDelay = (Math.random() * 0.6) + 's';
          el.style.borderRadius = (i % 2 === 0) ? '50%' : '2px';
          document.body.appendChild(el);
          (function (node) {
            setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 3400);
          })(el);
        }
      }

      function triggerMissionComplete(stageId, subTitle, badgeName) {
        stopStageTimer();
        var finalSec = state.timerSeconds;
        state.ceremonyStageId = stageId;
        state.ceremonyTimeSec = finalSec;
        state.ceremonySaved = false;

        if (state.badges.indexOf(stageId) === -1) {
          state.badges.push(stageId);
          saveStorage();
        }
        renderNav();

        document.getElementById('ceremonySub').textContent = subTitle;
        document.getElementById('ceremonyBadgeMount').innerHTML = svgBadge(stageId, 102);
        document.getElementById('ceremonyBadgeName').textContent = badgeName;
        var who = state.currentSeat !== null ? ('Champion Highlight: Trainer #' + state.currentSeat) : 'Class Victory!';
        document.getElementById('ceremonyTrainer').textContent = who;
        document.getElementById('ceremonyTime').textContent = 'Time: ' + formatTime(finalSec);

        var nameInp = document.getElementById('trainerNameInput');
        var saveBtn = document.getElementById('saveScoreBtn');
        var confirmBox = document.getElementById('saveScoreConfirm');
        nameInp.value = state.currentSeat !== null ? (state.currentSeat + ' ') : '';
        nameInp.disabled = false;
        saveBtn.disabled = false;
        confirmBox.style.display = 'none';

        var s1 = document.getElementById('cStar1');
        var s2 = document.getElementById('cStar2');
        var s3 = document.getElementById('cStar3');
        s1.innerHTML = svgStar(44);
        s2.innerHTML = svgStar(52);
        s3.innerHTML = svgStar(44);
        s1.classList.remove('lit');
        s2.classList.remove('lit');
        s3.classList.remove('lit');

        document.getElementById('ceremonyOverlay').classList.add('open');
        launchConfetti();
        playCeremonyFanfare();

        registerTimer(function () { s1.classList.add('lit'); playTone('star'); }, 400);
        registerTimer(function () { s2.classList.add('lit'); playTone('star'); }, 800);
        registerTimer(function () { s3.classList.add('lit'); playTone('star'); }, 1200);
      }

      function closeCeremony() {
        document.getElementById('ceremonyOverlay').classList.remove('open');
      }

      /***********************************************************************
       * 5. NAVIGATION & REGION MAP
       ***********************************************************************/
      function renderNav() {
        var tabs = [
          { id: 'map', label: 'Region Map' },
          { id: 'stage1', label: '1. Listen & Spell' },
          { id: 'stage2', label: '2. Match Q&A' },
          { id: 'stage3', label: '3. Build the Sentence' },
          { id: 'stage4', label: '4. Look & Complete' }
        ];
        var nav = document.getElementById('stageNav');
        nav.innerHTML = tabs.map(function (t) {
          var isAct = state.view === t.id;
          var isClr = state.badges.indexOf(t.id) !== -1;
          return '<button class="nav-tab ' + (isAct ? 'active' : '') + ' ' + (isClr ? 'cleared' : '') + '" data-nav="' + t.id + '">' +
            (isClr ? '<span class="icon-inline" style="color:#16a34a;">' + svgCheck(14) + '</span>' : '') +
            '<span>' + t.label + '</span>' +
          '</button>';
        }).join('');

        nav.querySelectorAll('[data-nav]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            goView(btn.getAttribute('data-nav'));
          });
        });
      }

      function goView(v) {
        clearAllTimers();
        stopStageTimer();
        playTone('click');
        hideBanner();
        closeCeremony();
        state.view = v;
        renderNav();
        if (v === 'map') renderMap();
        if (v === 'stage1') { startStageTimer(); setupStage1(state.s1Idx); }
        if (v === 'stage2') { startStageTimer(); setupStage2(); }
        if (v === 'stage3') { startStageTimer(); setupStage3(state.s3Idx); }
        if (v === 'stage4') { startStageTimer(); setupStage4(state.s4Idx); }
      }

      function renderMap() {
        var gyms = [
          { id: 'stage1', tag: 'Gym 1', color: '#4ade80', title: 'Listen & Spell', desc: 'Listen to the word and spell it to catch wild Pokemon!', art: svgCreature('leaf', 74) },
          { id: 'stage2', tag: 'Gym 2', color: '#c084fc', title: 'Match Q&A', desc: 'Match questions and answers to launch an elemental beam!', art: svgCreature('spark', 74) },
          { id: 'stage3', tag: 'Gym 3', color: '#38bdf8', title: 'Build the Sentence', desc: 'Tap word blocks in order to race down the Express Track!', art: svgCreature('wave', 74) },

            (earned ? svgBadge(id, 26) : '') +
          '</div>';
        }).join('');

        var vp = document.getElementById('stageViewport');
        vp.innerHTML = '<div class="map-hero">' +
          '<div class="map-header">' +
            '<div>' +
              '<div class="map-title">Kanto Gym Challenge Map</div>' +

                  (clr ? '<span style="color:#16a34a;font-weight:900;font-size:0.82rem;display:inline-flex;align-items:center;gap:4px;">' + svgCheck(14) + ' CLEARED</span>' : '') +
                '</div>' +
                '<div style="display:flex;align-items:center;gap:12px;">' +
                  '<div class="anim-float">' + g.art + '</div>' +
                  '<div>' +
                    '<div style="font-size:1.18rem;font-weight:900;">' + g.title + '</div>' +
                    '<div style="font-size:0.86rem;color:#475569;font-weight:700;margin-top:4px;">' + g.desc + '</div>' +

        vp.querySelectorAll('[data-open-gym]').forEach(function (card) {
          card.addEventListener('click', function () {
            goView(card.getAttribute('data-open-gym'));
          });
        });
